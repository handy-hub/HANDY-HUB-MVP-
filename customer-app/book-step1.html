<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="../shared/js/utils/themeManager.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Service | HandyHub</title>
  <link rel="stylesheet" href="css/booking-flow.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <link rel='stylesheet' href='../shared/css/ui-polish.css' />
  <!-- Auth guard runs before any page content renders -->
  <script type="module">
    import { requireAuth } from '../shared/js/utils/authGuard.js';
    await requireAuth();
  </script>
  <!-- Canonical service catalog → window.HH_CATALOG.
       Binds the booking step to the single source of truth
       (shared/js/data/serviceCatalog.js) instead of a hardcoded literal.
       Builds a label-keyed view in the exact shape the step-1 render code
       already expects, so no flow/logic changes — pure data binding. -->
  <script type="module">
    import { SERVICE_CATEGORIES } from '../shared/js/data/serviceCatalog.js';

    // Font Awesome icon classes for the small service-meta line, keyed by
    // category label. Rendered as <i class="${icon}"></i> by consumers, not
    // inserted as raw text — see CAT_ICONS usage in this file.
    const ICONS = {
      Electrical: 'fa-solid fa-bolt', Plumbing: 'fa-solid fa-wrench', Carpentry: 'fa-solid fa-hammer',
      'AC Repair': 'fa-solid fa-snowflake', Welding: 'fa-solid fa-fire', Cleaning: 'fa-solid fa-broom',
      Painting: 'fa-solid fa-paintbrush', Gardening: 'fa-solid fa-leaf',
    };
    const DEFAULT_ICON = 'fa-solid fa-hammer';

    const byLabel = {};   // { 'Electrical': [ {name,desc,price,dur,img}, ... ] }
    const meta    = {};   // { 'Electrical': { id, key } } — backend-aligned identifiers
    const icons   = {};
    for (const cat of SERVICE_CATEGORIES) {
      const label = cat.categoryLabel;
      byLabel[label] = (cat.services || []).map(s => ({
        name: s.name, desc: s.desc, price: s.price, dur: s.dur, img: s.img,
      }));
      meta[label]  = { id: cat.id, key: cat.key };
      icons[label] = ICONS[label] || DEFAULT_ICON;
    }

    window.HH_CATALOG = { byLabel, icons, meta, categories: SERVICE_CATEGORIES };
    // Signal late-binding consumers (book-step1 binds on DOMContentLoaded).
    window.dispatchEvent(new Event('hh-catalog-ready'));
  </script>
</head>
<body>
<div class="phone-shell">

  <!-- Header -->
  <div class="bk-header">
    <button class="bk-back-btn" onclick="window.location.href='dashboard.html'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M5 12l7 7M5 12l7-7" stroke="currentColor" stroke-width="2.0" stroke-linecap="round"/></svg>
    </button>
    <div class="bk-header-center">
      <p class="bk-header-title">Book a Service</p>
      <p class="bk-header-location">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#555"/></svg>
        Accra, Ghana
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#555" stroke-width="2" stroke-linecap="round"/></svg>
      </p>
    </div>
    <div class="bk-bell-wrap">
      <button class="bk-bell-btn" onclick="window.location.href='notification.html'" aria-label="Notifications">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <span class="bk-bell-badge" id="bk-bell-badge" style="display:none;">0</span>
    </div>
  </div>

  <!-- Stepper -->
  <div class="bk-stepper">
    <div class="bk-step active">
      <div class="bk-step-node">
        <div class="bk-step-circle">1</div>
        <div class="bk-step-connector"></div>
      </div>
      <span class="bk-step-label">Service</span>
    </div>
    <div class="bk-step">
      <div class="bk-step-node">
        <div class="bk-step-circle">2</div>
        <div class="bk-step-connector"></div>
      </div>
      <span class="bk-step-label">Professional</span>
    </div>
    <div class="bk-step">
      <div class="bk-step-node">
        <div class="bk-step-circle">3</div>
        <div class="bk-step-connector"></div>
      </div>
      <span class="bk-step-label">Schedule</span>
    </div>
    <div class="bk-step">
      <div class="bk-step-node">
        <div class="bk-step-circle">4</div>
      </div>
      <span class="bk-step-label">Confirm</span>
    </div>
  </div>

  <!-- Scroll -->
  <div class="bk-scroll">

    <!-- Pre-selected professional banner (shown only when arriving from an
         artisan profile / saved pro — confirms the user's choice survived) -->
    <div class="bk-chosen-pro" id="bk-chosen-pro" style="display:none;">
      <div class="bk-chosen-avatar" id="bk-chosen-avatar"></div>
      <div class="bk-chosen-info">
        <p class="bk-chosen-label">Booking with</p>
        <p class="bk-chosen-name" id="bk-chosen-name">Professional</p>
      </div>
      <button class="bk-chosen-change" id="bk-chosen-change" type="button">Change</button>
    </div>

    <div class="bk-page-head">
      <h2 class="bk-page-title">What service do you need?</h2>
      <button class="bk-filter-btn"> Popular
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.0" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- Search -->
    <div class="bk-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="#aaa" stroke-width="2"/><path d="m21 21-4.35-4.35" stroke="#aaa" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" placeholder="Search for a service..." id="svc-search">
    </div>

    <!-- Categories — rendered dynamically from the canonical service catalog -->
    <div class="cat-row" id="cat-row"></div>

    <!-- Section head -->
    <div class="bk-section-head">
      <h3 class="bk-section-title" id="section-title">Popular Electrical Services</h3>
      <button class="bk-view-all" onclick="selectCat(document.querySelector('.cat-icon-btn.active'), currentCat, true)">View All</button>
    </div>

    <!-- Service items (rendered dynamically by JS) -->
    <div id="service-list"></div>

    <!-- Location -->
    <div class="location-card">
      <div class="loc-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#730201"/><circle cx="12" cy="9" r="2.5" fill="#fff"/></svg>
      </div>
      <div class="loc-body">
        <p class="loc-label">Service Location</p>
        <div class="loc-value-row">
          <p class="loc-value">Home</p>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.0" stroke-linecap="round"/></svg>
        </div>
        <p class="loc-address" id="step1-loc-address">East Legon, Accra, Ghana</p>
      </div>
      <button class="loc-add-btn" onclick="window.location.href='settings-location.html'">+ Add New</button>
    </div>

    <!-- Promo -->
    <div class="promo-row" id="promo-row-trigger" onclick="togglePromoPanel()" style="cursor:pointer;">
      <div class="promo-row-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z" stroke="#2e7d32" stroke-width="2" stroke-linecap="round"/><circle cx="7" cy="7" r="1" fill="#2e7d32"/></svg>
      </div>
      <div>
        <p class="promo-row-label" id="promo-label">Have a promo code?</p>
        <p class="promo-row-sub" id="promo-sub">Apply code &amp; get discount</p>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="margin-left:auto; flex-shrink:0;" id="promo-chevron"><path d="M9 18l6-6-6-6" stroke="#bbb" stroke-width="2" stroke-linecap="round"/></svg>
    </div>

    <!-- Promo input panel (hidden by default) -->
    <div id="promo-panel" style="display:none; background:#fff; border-radius:14px; padding:14px 16px; margin-top:-6px; box-shadow:0 2px 12px rgba(0,0,0,0.07);">
      <div style="display:flex; gap:8px;">
        <input id="promo-input" type="text" placeholder="Enter promo code"
          style="flex:1; border:1.5px solid #eee; border-radius:10px; padding:10px 12px;
                 font-size:13px; font-family:inherit; outline:none; text-transform:uppercase;"
          oninput="this.value=this.value.toUpperCase()"
          onfocus="this.style.borderColor='#730201'" onblur="this.style.borderColor='#eee'">
        <button onclick="applyPromoCode()"
          style="background: var(--ui-primary); color:#fff; border:none; border-radius:10px;
                 padding:10px 16px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap;">
          Apply
        </button>
      </div>
      <p id="promo-result" style="font-size:12px; margin-top:8px; min-height:16px;"></p>
    </div>

  </div>

  <!-- Footer -->
  <div class="bk-footer">
    <div class="bk-footer-row1">
      <div class="bk-est-block">
        <p class="bk-est-label">Estimated Price <span style="color:#bbb; font-size:13px;">ⓘ</span></p>
        <p class="bk-est-value" id="price-display">GHC 50 – 500</p>
      </div>
      <button class="btn-continue" onclick="saveAndContinue()">
        Continue
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="#fff" stroke-width="2.0" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

</div>

<script>
  function _bkKey() { return window.HH_State ? window.HH_State.scopedKey('hh_booking') : 'hh_booking'; }
  const BK_KEY = _bkKey();
  function getState() { try { return JSON.parse(localStorage.getItem(BK_KEY)) || {}; } catch { return {}; } }

  /* ── Service catalogue ──
     SOURCE OF TRUTH: shared/js/data/serviceCatalog.js (the canonical catalog).
     The module script in <head> imports SERVICE_CATEGORIES and exposes a
     label-keyed view on window.HH_CATALOG before this script's render runs.
     We bind to it here so the existing render/search/save code is unchanged —
     it simply consumes real catalog data instead of a hardcoded literal.
     No business logic, pricing, or flow is computed here; this is pure data
     binding to the backend-aligned catalog. */
  /* Bound from the canonical catalog provided by a deferred module (see <head>).
     Populated in bindCatalog() before any render runs. Kept as the same
     SVC_CATALOG / CAT_ICONS names so all existing consumers are unchanged. */
  let SVC_CATALOG = {};
  let CAT_ICONS   = {};
  function bindCatalog() {
    if (window.HH_CATALOG) {
      SVC_CATALOG = window.HH_CATALOG.byLabel || {};
      CAT_ICONS   = window.HH_CATALOG.icons   || {};
    }
    // Keep the default category valid against the real catalog.
    if (!SVC_CATALOG[currentCat]) {
      const first = Object.keys(SVC_CATALOG)[0];
      if (first) currentCat = first;
    }
  }

  /* Build the category tab row from the canonical catalog. Each tab keeps the
     exact same selectCat(this, label) contract the flow already expects — only
     the source of the tabs changes from static HTML to real catalog data. */
  function renderCategoryTabs() {
    const row = document.getElementById('cat-row');
    const cats = (window.HH_CATALOG && window.HH_CATALOG.categories) || [];
    if (!row || !cats.length) return;
    row.innerHTML = cats.map(c => {
      const label  = c.categoryLabel;
      const active = label === currentCat ? ' active' : '';
      const id     = c.id ? ` data-cat="${escHtml(c.id)}"` : '';
      return `<button class="cat-icon-btn${active}"${id} onclick="selectCat(this, '${escHtml(label).replace(/'/g, "\\'")}')">
        ${c.icon || ''}
        <span>${escHtml(label)}</span>
      </button>`;
    }).join('');
  }

  /* ── State ── */
  let currentCat = 'Electrical';
  let selectedNames = new Set();

  /* ── Render service list ── */
  function renderServices(cat) {
    const list = document.getElementById('service-list');
    const svcs = SVC_CATALOG[cat] || [];
    if (!svcs.length) { list.innerHTML = '<p style="text-align:center;color:#aaa;padding:24px;">No services in this category yet.</p>'; return; }
    list.innerHTML = svcs.map(s => {
      const checked = selectedNames.has(s.name);
      const icon = CAT_ICONS[cat] || 'fa-solid fa-hammer';
      return `<div class="service-item${checked ? ' selected' : ''}" onclick="toggleService(this)"
          data-price="${s.price}" data-name="${escHtml(s.name)}" data-desc="${escHtml(s.desc)}"
          data-cat="${escHtml(cat)}" data-dur="${escHtml(s.dur)}">
        <img class="service-thumb" src="${s.img}" alt="${escHtml(s.name)}"
          onerror="this.style.cssText='width:68px;height:68px;border-radius:10px;background:linear-gradient(135deg,#fde8e8,#f5c5c5);flex-shrink:0;'">
        <div class="service-info">
          <p class="service-name">${escHtml(s.name)}</p>
          <p class="service-desc">${escHtml(s.desc)}</p>
          <div class="service-meta">
            <span><i class="${icon}"></i> ${escHtml(cat)}</span>
            <span><i class="fa-regular fa-clock"></i> ${escHtml(s.dur)}</span>
          </div>
        </div>
        <div class="service-right">
          <div>
            <p class="service-from">From</p>
            <p class="service-price">GHC ${s.price}</p>
          </div>
          <div class="service-checkbox${checked ? ' checked' : ''}">
            ${checked ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function escHtml(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Category selection ── */
  function selectCat(btn, cat) {
    document.querySelectorAll('.cat-icon-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    currentCat = cat;
    document.getElementById('section-title').textContent = `Popular ${cat} Services`;
    renderServices(cat);
  }

  /* ── Pre-selected professional (arriving from an artisan profile) ── */
  function getPreselectedArtisan() {
    try {
      if (sessionStorage.getItem('hh_booking_intent') !== 'artisan') return null;
      return JSON.parse(sessionStorage.getItem('hh_selected_artisan') || 'null');
    } catch (_) { return null; }
  }

  function applyPreselectedArtisan() {
    const pro = getPreselectedArtisan();
    if (!pro || !(pro.id || pro.uid)) return;

    // Persist the chosen professional into booking state so step 2 auto-confirms it.
    const st = getState();
    localStorage.setItem(BK_KEY, JSON.stringify({
      ...st,
      preselectedArtisan: {
        id:        pro.id || pro.uid,
        uid:       pro.uid || pro.id,
        name:      pro.name      || 'Professional',
        specialty: pro.specialty || pro.category || '',
        category:  pro.category  || pro.specialty || '',
        rating:    pro.rating != null ? pro.rating : null,
        reviewCount:     pro.reviewCount || 0,
        jobsCompleted:   pro.jobsCompleted || 0,
        yearsExperience: pro.yearsExperience || null,
        isAvailable:     Boolean(pro.isAvailable),
        phone:           pro.phone || null,
        profileImageId:      pro.profileImageId      || null,
        profileImageVersion: pro.profileImageVersion || null,
        profileImage:        pro.profileImage        || null,
      },
    }));

    // Show the banner.
    const wrap   = document.getElementById('bk-chosen-pro');
    const nameEl = document.getElementById('bk-chosen-name');
    const avEl   = document.getElementById('bk-chosen-avatar');
    if (wrap && nameEl) {
      nameEl.textContent = pro.name || 'Professional';
      if (avEl) {
        if (pro.profileImage) {
          avEl.style.backgroundImage = `url("${pro.profileImage}")`;
          avEl.textContent = '';
        } else {
          avEl.textContent = (pro.name || 'P').trim().charAt(0).toUpperCase();
        }
      }
      wrap.style.display = 'flex';
    }

    // Open the professional's service category so the user picks the job.
    const cat = pro.category || pro.specialty || '';
    if (cat && SVC_CATALOG[cat]) {
      currentCat = cat;
      document.querySelectorAll('.cat-icon-btn').forEach(b => {
        const label = b.querySelector('span')?.textContent?.trim();
        b.classList.toggle('active', b.dataset.cat === cat || label === cat);
      });
      const titleEl = document.getElementById('section-title');
      if (titleEl) titleEl.textContent = `Popular ${cat} Services`;
    }

    // Consume the intent flag now that it's persisted into booking state.
    // This prevents a later fresh booking (from the dashboard) from wrongly
    // inheriting this artisan if the sessionStorage entry lingers. The
    // preselectedArtisan lives in booking state, which the booking flow owns
    // and clears on completion.
    sessionStorage.removeItem('hh_booking_intent');
  }

  /* "Change" → drop the pre-selection and reload the standard picker. */
  document.getElementById('bk-chosen-change')?.addEventListener('click', function () {
    sessionStorage.removeItem('hh_booking_intent');
    sessionStorage.removeItem('hh_selected_artisan');
    const st = getState();
    delete st.preselectedArtisan;
    delete st.professional;
    localStorage.setItem(BK_KEY, JSON.stringify(st));
    const wrap = document.getElementById('bk-chosen-pro');
    if (wrap) wrap.style.display = 'none';
  });

  /* ── Toggle service ── */
  function toggleService(item) {
    const name = item.dataset.name;
    const cb = item.querySelector('.service-checkbox');
    const isChecked = cb.classList.contains('checked');
    if (isChecked) {
      selectedNames.delete(name);
      cb.classList.remove('checked');
      cb.innerHTML = '';
      item.classList.remove('selected');
    } else {
      selectedNames.add(name);
      cb.classList.add('checked');
      cb.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      item.classList.add('selected');
    }
    updatePrice();
  }

  /* ── Price display ── */
  function updatePrice() {
    if (selectedNames.size === 0) {
      document.getElementById('price-display').textContent = 'GHC 50 – 500';
      return;
    }
    // collect prices from all categories
    const all = Object.values(SVC_CATALOG).flat();
    const prices = [...selectedNames].map(n => { const s = all.find(x => x.name === n); return s ? s.price : 0; }).filter(p => p > 0);
    const min = Math.min(...prices);
    const total = prices.reduce((a, b) => a + b, 0);
    document.getElementById('price-display').textContent = `GHC ${min} – ${total}`;
  }

  /* ── Search ── */
  document.addEventListener('DOMContentLoaded', function () {
    bindCatalog();          // pull SVC_CATALOG / CAT_ICONS from the canonical catalog module
    renderCategoryTabs();   // build the category tabs from real catalog data
    document.getElementById('svc-search').addEventListener('input', function () {
      const q = this.value.trim().toLowerCase();
      if (!q) { renderServices(currentCat); return; }
      const all = Object.values(SVC_CATALOG).flat();
      const hits = all.filter(s => s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q));
      document.getElementById('section-title').textContent = `Results for "${this.value}"`;
      const list = document.getElementById('service-list');
      if (!hits.length) { list.innerHTML = '<p style="text-align:center;color:#aaa;padding:24px;">No services found.</p>'; return; }
      list.innerHTML = hits.map(s => {
        const cat = Object.keys(SVC_CATALOG).find(c => SVC_CATALOG[c].includes(s)) || '';
        const checked = selectedNames.has(s.name);
        return `<div class="service-item${checked ? ' selected' : ''}" onclick="toggleService(this)"
            data-price="${s.price}" data-name="${escHtml(s.name)}" data-desc="${escHtml(s.desc)}"
            data-cat="${escHtml(cat)}" data-dur="${escHtml(s.dur)}">
          <img class="service-thumb" src="${s.img}" alt="${escHtml(s.name)}"
            onerror="this.style.cssText='width:68px;height:68px;border-radius:10px;background:#fde8e8;flex-shrink:0;'">
          <div class="service-info">
            <p class="service-name">${escHtml(s.name)}</p>
            <p class="service-desc">${escHtml(s.desc)}</p>
            <div class="service-meta"><span><i class="${CAT_ICONS[cat]||'fa-solid fa-hammer'}"></i> ${escHtml(cat)}</span><span><i class="fa-regular fa-clock"></i> ${escHtml(s.dur)}</span></div>
          </div>
          <div class="service-right">
            <div><p class="service-from">From</p><p class="service-price">GHC ${s.price}</p></div>
            <div class="service-checkbox${checked ? ' checked' : ''}">${checked ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</div>
          </div>
        </div>`;
      }).join('');
    });

    // Restore selections if coming back from step 2
    const state = getState();
    if (state.services) {
      state.services.forEach(s => selectedNames.add(s.name));
      if (state.category && SVC_CATALOG[state.category]) {
        currentCat = state.category;
        document.querySelectorAll('.cat-icon-btn').forEach(b => {
          if (b.dataset.cat === currentCat || b.querySelector('span')?.textContent?.trim() === currentCat) b.classList.add('active');
          else b.classList.remove('active');
        });
        document.getElementById('section-title').textContent = `Popular ${currentCat} Services`;
      }
    }

    // Pre-open a service category passed via sessionStorage (dashboard quick
    // chips, rebook-without-artisan, category shortcuts). Pure convenience — the
    // user can still switch categories. Skipped if state already restored one.
    if (!(state.category && SVC_CATALOG[state.category])) {
      try {
        const hint = sessionStorage.getItem('hh_service');
        if (hint && SVC_CATALOG[hint]) {
          currentCat = hint;
          document.querySelectorAll('.cat-icon-btn').forEach(b => {
            const label = b.querySelector('span')?.textContent?.trim();
            b.classList.toggle('active', b.dataset.cat === hint || label === hint);
          });
          const t = document.getElementById('section-title');
          if (t) t.textContent = `Popular ${hint} Services`;
        }
      } catch (_) {}
    }

    // ── Professional-first booking (I4): user arrived from an artisan profile.
    //    Show the "Booking with {name}" banner, persist the chosen pro into
    //    booking state, and pre-open that pro's service category so the user
    //    only has to pick which job they need done. (Overrides the hint above
    //    with the artisan's own category when present.)
    applyPreselectedArtisan();

    renderServices(currentCat);
    updatePrice();

    // Restore previously applied promo code if user came back to this step
    if (state.promoCode && VALID_PROMO_CODES[state.promoCode]) {
      const promo = VALID_PROMO_CODES[state.promoCode];
      appliedPromo = { code: state.promoCode, ...promo };
      const label = document.getElementById('promo-label');
      const sub   = document.getElementById('promo-sub');
      if (label) label.textContent = `Promo: ${state.promoCode}`;
      if (sub)   sub.textContent   = promo.label;
    }

    // Notification badge
    try {
      const count = parseInt(localStorage.getItem('unread_notifications') || '0', 10);
      const badge = document.getElementById('bk-bell-badge');
      if (badge && count > 0) { badge.textContent = count > 99 ? '99+' : count; badge.style.display = ''; }
    } catch {}
  });

  /* ── Continue ── */
  function saveAndContinue() {
    if (selectedNames.size === 0) { showToast('Please select at least one service'); return; }
    const all = Object.values(SVC_CATALOG).flat();
    const services = [...selectedNames].map(name => {
      const s = all.find(x => x.name === name);
      return s ? { name: s.name, desc: s.desc, price: s.price, category: Object.keys(SVC_CATALOG).find(c => SVC_CATALOG[c].includes(s)) || '', duration: s.dur } : null;
    }).filter(Boolean);
    const prices = services.map(s => s.price);
    const serviceFee = prices.reduce((a, b) => a + b, 0);
    const serviceCharge = 10, platformFee = 5;
    localStorage.setItem(BK_KEY, JSON.stringify({
      services,
      totalMin: Math.min(...prices),
      totalMax: serviceFee,
      serviceFee, serviceCharge, platformFee,
      total: serviceFee + serviceCharge + platformFee,
      category: services[0]?.category || currentCat,
    }));
    window.location.href = 'book-step2.html';
  }

  /* ── Dynamic location from GPS cache ── */
  (function () {
    try {
      const locCache = JSON.parse(localStorage.getItem('hh_detected_location') || 'null');
      const addrEl   = document.getElementById('step1-loc-address');
      if (addrEl && locCache && locCache.loc) {
        addrEl.textContent = locCache.loc;
      } else {
        // Fallback: read from booking state if address was set previously
        const st = getState();
        if (addrEl && st.address) addrEl.textContent = st.address;
      }
    } catch (_) {}
  })();

  /* ── Promo code panel ── */
  const VALID_PROMO_CODES = {
    'HANDY10':  { label: '10% off your first booking!',     discount: 0.10, type: 'percent' },
    'WELCOME20': { label: '20% off — welcome discount!',    discount: 0.20, type: 'percent' },
    'FLAT50':   { label: 'GHC 50 flat discount applied!',   discount: 50,   type: 'flat'    },
    'NEWUSER':  { label: '15% off for new users!',          discount: 0.15, type: 'percent' },
  };
  let appliedPromo = null;
  let promoOpen    = false;

  window.togglePromoPanel = function () {
    promoOpen = !promoOpen;
    const panel    = document.getElementById('promo-panel');
    const chevron  = document.getElementById('promo-chevron');
    if (!panel) return;
    panel.style.display = promoOpen ? 'block' : 'none';
    if (chevron) chevron.style.transform = promoOpen ? 'rotate(90deg)' : '';
    if (promoOpen) setTimeout(() => document.getElementById('promo-input')?.focus(), 80);
  };

  window.applyPromoCode = function () {
    const input  = document.getElementById('promo-input');
    const result = document.getElementById('promo-result');
    if (!input || !result) return;

    const code = input.value.trim().toUpperCase();
    if (!code) { result.style.color = '#e53935'; result.textContent = 'Please enter a promo code.'; return; }

    const promo = VALID_PROMO_CODES[code];
    if (!promo) {
      result.style.color = '#e53935';
      result.textContent = `"${code}" is not a valid promo code.`;
      appliedPromo = null;
      return;
    }

    appliedPromo = { code, ...promo };
    result.style.color = '#2e7d32';
    result.textContent = `✓ ${promo.label}`;

    // Update the promo row label to show applied code
    const label = document.getElementById('promo-label');
    const sub   = document.getElementById('promo-sub');
    if (label) label.textContent = `Promo: ${code}`;
    if (sub)   sub.textContent   = promo.label;

    showToast(`Promo code ${code} applied — discount active`, 'success');

    // Persist to booking state for checkout
    const st = getState();
    localStorage.setItem(BK_KEY, JSON.stringify({
      ...st,
      promoCode:    code,
      promoDiscount: promo.discount,
      promoType:    promo.type,
    }));

    // Close panel after short delay
    setTimeout(() => window.togglePromoPanel(), 900);
  };

  const BOOK_STEP_TOAST_ICON = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 10V16" stroke="currentColor" stroke-width="2.0" stroke-linecap="round"/><path d="M12 7.6V7.65" stroke="currentColor" stroke-width="2.0" stroke-linecap="round"/></svg>';

  function showToast(msg) {
    document.querySelector('.toast.app-toast')?.remove();
    const t = document.createElement('div');
    t.className = 'toast app-toast info';
    t.setAttribute('role','status'); t.setAttribute('aria-live','polite'); t.setAttribute('aria-atomic','true');
    const icon = document.createElement('span'); icon.className = 'toast-icon'; icon.setAttribute('aria-hidden','true'); icon.innerHTML = BOOK_STEP_TOAST_ICON;
    const text = document.createElement('span'); text.className = 'toast-message'; text.textContent = msg;
    t.append(icon, text);
    document.body.appendChild(t);
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => { t.classList.add('toast-exit'); setTimeout(() => t.remove(), 320); }, 3000);
  }
</script>
</body>
</html>
