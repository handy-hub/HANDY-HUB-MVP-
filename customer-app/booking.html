<body>
<div class="bk-shell">

  <div class="bk-main-header">
    <button class="back-btn" onclick="window.location.href='dashboard.html'" aria-label="Go back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 class="bk-main-title">Bookings</h1>
    <div class="bk-header-actions">
      <button class="bk-icon-btn" onclick="window.location.href='notification.html'" aria-label="Notifications">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="#111" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="#111" stroke-width="1.85" stroke-linecap="round"/></svg>

    <button class="ui-tab"        role="tab" aria-selected="false" onclick="switchTab('ongoing',this)">Active</button>
    <button class="ui-tab"        role="tab" aria-selected="false" onclick="switchTab('completed',this)">Completed</button>
    <button class="ui-tab"        role="tab" aria-selected="false" onclick="switchTab('cancelled',this)">Cancelled</button>
  </div>

  <div class="bk-body">

    <!-- ── UPCOMING ── -->
    <div class="bk-panel active" id="panel-upcoming">
      <div class="bk-banner">
        <div class="bk-banner-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="4" width="18" height="18" rx="2" stroke="#fff" stroke-width="2"/>
            <path d="M3 10h18M8 2v4M16 2v4" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="bk-banner-body">
          <p class="bk-banner-title">Need a service?</p>
          <p class="bk-banner-sub">Book trusted professionals<br>near you in minutes.</p>
        </div>
        <button class="bk-banner-btn" onclick="window.location.href='book-request.html'">Book Now</button>
      </div>

      <h2 class="bk-section-title">Upcoming Bookings</h2>
      <div id="list-upcoming"></div>
    </div>

    <!-- ── ACTIVE ── -->
    <div class="bk-panel" id="panel-ongoing">
      <h2 class="bk-section-title">Active Jobs</h2>
      <div id="list-ongoing"></div>
    </div>

    <!-- ── COMPLETED ── -->
    <div class="bk-panel" id="panel-completed">
      <h2 class="bk-section-title">Completed Bookings</h2>
      <div id="list-completed"></div>
    </div>

    <!-- ── CANCELLED ── -->
    <div class="bk-panel" id="panel-cancelled">
      <h2 class="bk-section-title">Cancelled Bookings</h2>
      <div id="list-cancelled"></div>
    </div>

  </div>

<script src="../shared/js/utils/global-app.js"></script>
<script src="../shared/js/components/floatingNav.js"></script>
<script type="module" src="js/authInit.js"></script>

<script type="module">
import { requireAuth }              from '../shared/js/utils/authGuard.js';
import { getAppContainer }          from '../shared/js/app/container.js';
import { createBookingRepository }  from '../shared/js/data/repositories/bookingRepository.js';
import { releaseEscrow }            from '../shared/js/services/walletService.js';
import {
  TAB_STATUSES, describe, getActiveProgress, isCancellable,
}                                    from '../shared/js/domain/bookingStatusMeta.js';
import { wireSwipeAction, createUndoToast } from '../shared/js/components/swipeAction.js';
import { pricingService }           from '../shared/js/services/pricingService.js';
import { showToast }                from '../shared/js/components/toast.js';
import { bookingHref }              from '../shared/js/domain/bookingRouter.js';

await requireAuth();

// ── MODULE STATE ──────────────────────────────────────────────────────────────
let _allBookings = [];
let _unsub       = null;
let _firstPaint  = false;

// ── HELPERS ───────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  if (!d) return null;
  try {
    const dt = d?.toDate ? d.toDate() : new Date(d);
    if (isNaN(dt)) return String(d);
    return dt.toLocaleDateString('en-GH', { day: 'numeric', month: 'short', year: 'numeric' });
  } catch { return String(d); }
}

// Adapter over the shared bookingStatusMeta source of truth (customer audience,
// track-aware). `group` (upcoming|ongoing|completed|cancelled) becomes the
// `bk-status-${group}` CSS class this page's card builders already render
// against. Passing the full booking makes inspection-track labels correct
// (e.g. an accepted-unpaid inspection reads "Pay visit fee", not "Accepted").
function getMeta(booking) {
  const d = describe(booking, 'customer');
  return { label: d.label, cls: `bk-status-${d.group}` };
}

// Stage-aware money figure. Inspection-track bookings have no `total`/`price`
// until a job quote is approved — before that the meaningful figure is the
// callout fee (then the quote). This stops inspection cards showing "GHS —".
function amountFor(b) {
  const jobTotal = b.total || b.price || b.jobQuote;
  if (jobTotal) return { label: 'Total', value: Number(jobTotal).toFixed(2) };
  if (b.track === 'inspection') {
    if (b.jobQuote)   return { label: 'Quote',   value: Number(b.jobQuote).toFixed(2) };
    if (b.calloutFee) return { label: 'Callout', value: Number(b.calloutFee).toFixed(2) };
  }
  return { label: 'Total', value: '—' };
}

function avatarHtml(name, photo) {
  const initials = (name || 'P').split(' ').map(w => w[0] || '').join('').slice(0, 2).toUpperCase();
  if (photo) return `<img class="bk-card-photo" src="${escHtml(photo)}" alt="${escHtml(name)}" onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.style.display='')">`;
  return `<div class="bk-card-photo-grad" style="background:linear-gradient(135deg,#730201,#a03030);">${initials}</div>`;
}

// ── SKELETON ──────────────────────────────────────────────────────────────────
function skeletonCard() {
  return `<div class="bk-card" style="pointer-events:none;animation:bkPulse 1.4s ease-in-out infinite;">
    <div class="bk-card-photo-wrap"><div class="bk-card-photo-grad" style="background:#e8e8e8;"></div></div>
    <div class="bk-card-body">
      <div style="height:13px;width:55%;border-radius:6px;background:#e8e8e8;margin-bottom:9px;"></div>
      <div style="height:11px;width:38%;border-radius:6px;background:var(--ui-surface-2);margin-bottom:7px;"></div>
      <div style="height:10px;width:48%;border-radius:6px;background:var(--ui-surface-2);"></div>
    </div>
    <div class="bk-card-right">
      <div style="height:22px;width:62px;border-radius:10px;background:#e8e8e8;"></div>
    </div>
  </div>`;
}

function showSkeletons(id, count = 3) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = Array(count).fill(skeletonCard()).join('');
}

// ── EMPTY STATES ──────────────────────────────────────────────────────────────
function emptyState(icon, title, sub, btnText, href) {
  return `<div class="bk-empty">
    <div class="bk-empty-icon">${icon}</div>
    <p class="bk-empty-title">${title}</p>
    <p class="bk-empty-sub">${sub}</p>
    <button class="bk-empty-btn" onclick="window.location.href='${href}'">${btnText}</button>
  </div>`;
}

const CAL_ICO  = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const CLK_ICO  = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const CHK_ICO  = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M22 4L12 14.01l-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const CAN_ICO  = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M15 9l-6 6M9 9l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;

// ── CARD BUILDERS ─────────────────────────────────────────────────────────────
// buildUpcomingCard / buildCompletedCard / buildCancelledCard share the same
// interaction model (a static info row you tap to view, with a status pill +
// amount on the right) — they render through this one shell, varying only in
// the meta-row content and whether the row can be swiped to cancel. This
// mirrors the Notification page's single-card-shell approach rather than each
// tab hand-rolling its own row markup.
function buildSimpleCard(b, { metaRows, amountLabel, amountValue, amountStyle = '', cancellable = false }) {
  const meta  = getMeta(b);
  const name  = b.proName || b.artisanName || 'Professional';
  const photo = b.proPhoto || null;
  const clickHandler = cancellable ? `window._viewBookingGuarded('${escHtml(b.id)}')` : `window._viewBooking('${escHtml(b.id)}')`;
  const card = `
    <div class="bk-card${cancellable ? ' swipe-card' : ''}"${cancellable ? ` data-id="${escHtml(b.id)}"` : ''} onclick="${clickHandler}">
      <div class="bk-card-photo-wrap">
        ${avatarHtml(name, photo)}
        <div class="bk-card-svc-badge"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M13 10V3L4 14h7v7l9-11h-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
      </div>
      <div class="bk-card-body">
        <p class="bk-card-service">${escHtml(b.serviceType || b.service || 'Service')}</p>
        <div class="bk-card-pro-row">
          <span class="bk-card-pro-name">${escHtml(name)}</span>
          <div class="bk-verified"><svg width="8" height="8" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg></div>
        </div>
        <div class="bk-card-meta">${metaRows}</div>
      </div>
      <div class="bk-card-right">
        <span class="bk-status-tag ${meta.cls}">${meta.label}</span>
        <div class="bk-total" style="margin-top:auto;"><p class="bk-total-label">${amountLabel}</p><p class="bk-total-val" style="${amountStyle}">GHS ${amountValue}</p></div>
      </div>
    </div>`;

  if (!cancellable) return card;

  // Cancellable rows adopt the canonical swipe-to-action shell (shared/js/
  // components/swipeAction.js) — same gesture, thresholds, and reveal
  // animation as the Notification page's swipe-to-delete, wired to a
  // "Cancel" action instead since deleting a booking record is not a
  // supported (or safe) operation for a financial/escrow-backed entity.
  return `
    <div class="swipe-row">
      <div class="swipe-action" aria-hidden="true">
        <i class="fa-solid fa-ban"></i>
        <span>Cancel</span>
      </div>
      ${card}
    </div>`;
}

function buildUpcomingCard(b) {
  const date = b.dateDisplay || fmtDate(b.scheduledAt) || fmtDate(b.createdAt) || 'Scheduled';
  const metaRows = `
    <div class="bk-card-meta-row"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="#aaa" stroke-width="2"/><path d="M3 10h18" stroke="#aaa" stroke-width="2"/></svg>${escHtml(date)}</div>
    ${b.time ? `<div class="bk-card-meta-row"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#aaa" stroke-width="2"/><path d="M12 6v6l4 2" stroke="#aaa" stroke-width="2" stroke-linecap="round"/></svg>${escHtml(b.time)}</div>` : ''}`;
  const amt = amountFor(b);
  return buildSimpleCard(b, {
    metaRows,
    amountLabel: amt.label,
    amountValue: amt.value,
    cancellable: isCancellable(b),
  });
}

function buildActiveCard(b) {
  const name  = b.proName || b.artisanName || 'Professional';
  const photo = b.proPhoto || null;
  const prog  = getActiveProgress(b.status);
  const meta  = getMeta(b);
  const isAwaiting = (b.status || '').toLowerCase() === 'awaiting';
  return `
  <div class="bk-active-card">
    <div class="bk-active-top">
      <div class="bk-card-photo-wrap">
        ${avatarHtml(name, photo)}
        <div class="bk-card-svc-badge" style="background:#e3f2fd;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" fill="#1565c0"/></svg></div>
      </div>
      <div class="bk-card-body">
        <p class="bk-card-service">${escHtml(b.serviceType || b.service || 'Service')}</p>
        <div class="bk-card-pro-row">
          <span class="bk-card-pro-name">${escHtml(name)}</span>
          <div class="bk-verified"><svg width="8" height="8" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg></div>
        </div>
        <div class="bk-card-meta">
          <div class="bk-card-meta-row"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="#aaa" stroke-width="2"/><path d="M3 10h18" stroke="#aaa" stroke-width="2"/></svg>${escHtml(b.dateDisplay || 'Today')}</div>
        </div>
      </div>
      <div class="bk-completed-right">
        <span class="bk-status-tag ${meta.cls}">${meta.label}</span>
        <p class="bk-completed-amount">GHS ${amountFor(b).value}</p>
      </div>
    </div>
    <div class="bk-progress-wrap">
      <div class="bk-progress-bar"><div class="bk-progress-fill" style="width:${prog.pct}%;transition:width .6s ease;"></div></div>
      <div class="bk-progress-labels"><span>${prog.label}</span></div>
    </div>
    <div class="bk-active-actions">
      <button class="bk-active-btn bk-active-btn--track" onclick="window._trackBooking('${escHtml(b.id)}')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Track
      </button>
      <button class="bk-active-btn bk-active-btn--outline" onclick="window.location.href='messages.html'">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="#555" stroke-width="2" stroke-linecap="round"/></svg>Message
      </button>
      ${isAwaiting ? `<button class="bk-active-btn bk-active-btn--confirm" onclick="window._confirmJobDone('${escHtml(b.id)}','${escHtml(b.escrowId || '')}',this)">Confirm Done</button>` : ''}
    </div>
  </div>`;
}

function buildCompletedCard(b) {
  const hasReview = !!(b.reviewLeft || b.review);
  const date      = b.dateDisplay || fmtDate(b.completedAt) || fmtDate(b.createdAt) || 'Completed';
  const metaRows = `
    <div class="bk-card-meta-row"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="#aaa" stroke-width="2"/><path d="M3 10h18" stroke="#aaa" stroke-width="2"/></svg>${escHtml(date)}</div>
    ${hasReview
      ? `<div class="bk-card-meta-row" style="color:#f5a623;"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i> Reviewed</div>`
      : `<div class="bk-card-meta-row"><button style="background:none;border:none;color: var(--ui-primary);font-size:11.5px;font-weight:700;cursor:pointer;padding:0;" onclick="event.stopPropagation();window._openReview('${escHtml(b.id)}')">Leave a review</button></div>`}
    <div class="bk-card-meta-row"><button style="background:none;border:none;color: var(--ui-primary);font-size:11.5px;font-weight:700;cursor:pointer;padding:0;" onclick="event.stopPropagation();window._rebook('${escHtml(b.id)}')">Book again</button></div>`;
  return buildSimpleCard(b, {
    metaRows,
    amountLabel: 'Paid',
    amountValue: amountFor(b).value,
  });
}

function buildCancelledCard(b) {
  const date = b.dateDisplay || fmtDate(b.createdAt) || 'Cancelled';
  const metaRows = `
    <div class="bk-card-meta-row"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="#aaa" stroke-width="2"/><path d="M3 10h18" stroke="#aaa" stroke-width="2"/></svg>${escHtml(date)}</div>
    <div class="bk-card-meta-row"><button style="background:none;border:none;color: var(--ui-primary);font-size:11.5px;font-weight:700;cursor:pointer;padding:0;" onclick="event.stopPropagation();window._rebook('${escHtml(b.id)}')">Rebook</button></div>`;
  return buildSimpleCard(b, {
    metaRows,
    amountLabel: 'Amount',
    amountValue: amountFor(b).value,
    amountStyle: 'color:#aaa;',
  });
}

// ── Swipe-to-cancel (upcoming bookings only) ──────────────────────────────────
// Reuses the exact gesture mechanics extracted from the Notification page's
// swipe-to-delete (shared/js/components/swipeAction.js): same thresholds,
// same spring-back animation, same undo-toast pattern — wired to a "Cancel"
// action instead, since a booking's actual delete equivalent is a status
// transition (cancelled), not row removal.
const cancelUndoToast = createUndoToast({ message: 'Booking cancelled', icon: 'fa-solid fa-ban' });
let getLastSwipeTime = () => 0;

async function commitCancel(bookingId) {
  const booking = _allBookings.find(b => b.id === bookingId);
  try {
    if (booking?.track === 'inspection') {
      // Inspection-track cancellations MUST go through the Cloud Function so
      // the callout escrow settles fairly (refund vs release is decided
      // server-side by settleCallout). Raw status writes on this track are
      // rejected by firestore.rules.
      await pricingService.cancelInspectionBooking(bookingId, 'Cancelled by customer');
    } else {
      const { services: { databaseService } } = getAppContainer();
      const n = new Date().toISOString();
      await databaseService.updateDocument('bookings', bookingId, {
        status: 'cancelled', cancellationReason: 'Cancelled by customer', updatedAt: n,
      });
      // The onBookingStatusChanged Cloud Function trigger (functions/bookings.js)
      // handles escrow refund + both-party notification automatically — this
      // page only needs to write the status transition.
    }
  } catch (e) {
    console.error('[booking] Cancel failed:', e);
    // The undo toast already claimed success — put the row back and say so.
    render(_allBookings);
    showToast(e?.message || 'Could not cancel this booking. Please try again.', 'error');
  }
}

function initiateCancel(bookingId) {
  const booking = _allBookings.find(b => b.id === bookingId);
  if (!booking) return;

  cancelUndoToast.show(
    bookingId,
    { booking },
    (committedId) => { commitCancel(committedId); },
    () => {
      // Undo: nothing to restore server-side (no write happened yet) — just
      // re-render so the row reappears from the still-live _allBookings state.
      render(_allBookings);
    }
  );
}

// ── RENDER ─────────────────────────────────────────────────────────────────────
function render(bookings) {
  const upcoming  = bookings.filter(b => TAB_STATUSES.upcoming.includes((b.status  || '').toLowerCase()));
  const ongoing   = bookings.filter(b => TAB_STATUSES.ongoing.includes((b.status   || '').toLowerCase()));
  const completed = bookings.filter(b => TAB_STATUSES.completed.includes((b.status || '').toLowerCase()));
  const cancelled = bookings.filter(b => TAB_STATUSES.cancelled.includes((b.status || '').toLowerCase()));

  document.getElementById('list-upcoming').innerHTML = upcoming.length
    ? upcoming.map(buildUpcomingCard).join('')
    : emptyState(CAL_ICO, 'No Upcoming Bookings', 'Book a trusted professional near you.', 'Book a Service', 'book-request.html');

  const upcomingListEl = document.getElementById('list-upcoming');
  if (upcoming.length) {
    getLastSwipeTime = wireSwipeAction(upcomingListEl, { onCommit: initiateCancel });
  }

  document.getElementById('list-ongoing').innerHTML = ongoing.length
    ? ongoing.map(buildActiveCard).join('')
    : emptyState(CLK_ICO, 'No Active Jobs', 'You have no ongoing jobs right now.', 'Book a Service', 'book-request.html');

  document.getElementById('list-completed').innerHTML = completed.length
    ? completed.map(buildCompletedCard).join('')
    : emptyState(CHK_ICO, 'No Completed Bookings', 'Completed bookings will appear here.', 'Book a Service', 'book-request.html');

  document.getElementById('list-cancelled').innerHTML = cancelled.length
    ? cancelled.map(buildCancelledCard).join('')
    : emptyState(CAN_ICO, 'No Cancelled Bookings', "Great! You haven't cancelled any bookings.", 'Book a Service', 'book-request.html');

  // Tab counts
  const labels = ['Upcoming','Active','Completed','Cancelled'];
  const counts = [upcoming.length, ongoing.length, completed.length, cancelled.length];
  document.querySelectorAll('.ui-tab').forEach((tab, i) => {
    tab.textContent = counts[i] > 0 ? `${labels[i]} (${counts[i]})` : labels[i];
  });

  // Active dot on bell
  const dot = document.getElementById('notif-dot');
  if (dot) dot.style.display = ongoing.length > 0 ? '' : 'none';
}

// ── GLOBAL ACTIONS ────────────────────────────────────────────────────────────
window.switchTab = function(tab, btn) {
  document.querySelectorAll('.ui-tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected','false'); });
  btn.classList.add('active');
  btn.setAttribute('aria-selected','true');
  document.querySelectorAll('.bk-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab)?.classList.add('active');
};

// Swipeable (cancellable) cards route through this guard so a swipe gesture's
// trailing touchend doesn't also open the booking — same 300ms debounce the
// Notification page uses between wireSwipeAction() and its card click handler.
window._viewBookingGuarded = function(id) {
  if (Date.now() - getLastSwipeTime() < 300) return;
  window._viewBooking(id);
};

window._viewBooking = function(id) {
  const b  = _allBookings.find(bk => bk.id === id);
  if (!b) return;

  // Resolve the destination through the single routing contract
  // (shared/js/domain/bookingRouter.js). This is what closes the F2 dead-end:
  // an inspection booking that is waiting for the callout payment now routes to
  // book-request.html?resume=ID (the only screen with the pay control) instead
  // of silently doing nothing or dropping onto live-tracking with no payment UI.
  const href = bookingHref({ ...b, bookingId: b.id });

  // live-tracking reads active-booking context from HH_State — seed it before we go.
  if (href.startsWith('live-tracking')) {
    try {
      if (window.HH_State) {
        window.HH_State.booking.patch({
          bookingId:    b.id,
          id:           b.id,
          status:       b.status,
          service:      b.serviceType || b.service,
          artisanId:    b.artisanId,
          escrowId:     b.escrowId || window.HH_State.booking.get().escrowId || null,
          professional: { id: b.artisanId, uid: b.artisanId, name: b.proName, photo: b.proPhoto || null },
        });
      }
    } catch(_) {}
  }
  window.location.href = href;
};

window._trackBooking  = window._viewBooking;
window.viewBooking    = window._viewBooking;

window._openReview = function(bookingId) {
  if (bookingId) sessionStorage.setItem('hh_review_booking_id', String(bookingId));
  window.location.href = 'review.html';
};
window.openReview = window._openReview;

/* ── Rebook (I7): carry the previous booking's service + professional into the
   booking flow so the returning customer doesn't re-enter everything. Converges
   on the same professional-first path used from an artisan profile. ── */
window._rebook = function(id) {
  const b = _allBookings.find(bk => bk.id === id);
  if (!b) { window.location.href = 'book-request.html'; return; }

  const category = b.category || b.serviceType || b.service || '';

  // Seed the chosen professional (if the prior booking had one) using the same
  // contract book-step1/book-step2 already understand.
  if (b.artisanId) {
    sessionStorage.setItem('hh_selected_artisan', JSON.stringify({
      id:           b.artisanId,
      uid:          b.artisanId,
      name:         b.proName   || 'Professional',
      specialty:    b.proType   || '',
      category:     category,
      rating:       b.proRating || null,
      phone:        b.proPhone  || null,
      profileImage: b.proPhoto  || null,
    }));
    sessionStorage.setItem('hh_booking_intent', 'artisan');
  }
  sessionStorage.setItem('hh_service', category);
  // Flag so the booking flow / analytics know this is a rebook of a prior job.
  sessionStorage.setItem('hh_rebook_of', String(id));
  window.location.href = 'book-request.html';
};
window.rebook = window._rebook;

window._confirmJobDone = async function(bookingId, escrowId, btn) {
  if (!confirm('Confirm the job is complete? This releases payment to the artisan.')) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Confirming…'; }

  try {
    const { services: { databaseService } } = getAppContainer();
    const n = new Date().toISOString();

    await databaseService.updateDocument('bookings', bookingId, {
      status: 'completed', completedAt: n, updatedAt: n,
    });

    // Release escrow
    const eid = escrowId || (window.HH_State ? window.HH_State.booking.get().escrowId : null) || null;
    if (eid) {
      await releaseEscrow(eid).catch(e => console.warn('[booking] escrow release:', e.message));
    }

    if (bookingId) sessionStorage.setItem('hh_review_booking_id', String(bookingId));
    window.location.href = 'review.html';

  } catch(e) {
    console.error('[booking] confirmJobDone failed:', e);
    if (btn) { btn.disabled = false; btn.textContent = 'Confirm Done'; }
    alert('Could not confirm. Please try again or use the tracking screen.');
  }
};
window.confirmJobDone = window._confirmJobDone;

// ── BOOT ──────────────────────────────────────────────────────────────────────
// 1. Show skeletons immediately
['list-upcoming','list-ongoing','list-completed','list-cancelled'].forEach(id => showSkeletons(id));

// 2. Fast first paint from uid-scoped cache
const BK_CACHE_BASE = 'hh_bk_cache';
let   BK_CACHE_KEY  = BK_CACHE_BASE; // scoped to uid once auth resolves
try {
  const lastUid = (window.HH_State && window.HH_State.currentUid())
      || (function(){ try { return localStorage.getItem('hh_last_session_uid'); } catch { return null; } }());
  if (lastUid) BK_CACHE_KEY = BK_CACHE_BASE + '_' + lastUid;
  const cached = JSON.parse(localStorage.getItem(BK_CACHE_KEY) || '[]');
  if (cached.length) { render(cached); _firstPaint = true; }
} catch(_) {}

// 3. Live Firestore subscription
const { services: { authService, databaseService } } = getAppContainer();
const bookingRepo = createBookingRepository({ databaseService });

authService.subscribeToAuthState(user => {
  if (!user) return;
  if (_unsub) { _unsub(); _unsub = null; }

  // Activate uid-scoped cache key for this user
  BK_CACHE_KEY = BK_CACHE_BASE + '_' + user.uid;

  _unsub = bookingRepo.subscribeByCustomerId(
    user.uid,
    records => {
      _allBookings = records.map(r => ({ id: r.id, ...(r.data || {}) }));
      try { localStorage.setItem(BK_CACHE_KEY, JSON.stringify(_allBookings.slice(0, 30))); } catch(_) {}
      render(_allBookings);
    },
    err => {
      console.error('[booking] Firestore subscription error:', err);
      if (!_firstPaint) {
        ['list-upcoming','list-ongoing','list-completed','list-cancelled'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.innerHTML = '<p style="text-align:center;padding:32px 16px;color:#999;">Could not load bookings. Check your connection and refresh.</p>';
        });
      }
    }
  );
});

window.addEventListener('pagehide', () => {
  if (_unsub) _unsub();
  cancelUndoToast.commitAll();
});
</script>

<style>
@keyframes bkPulse { 0%,100%{opacity:1} 50%{opacity:.5} }
</style>
</body>
