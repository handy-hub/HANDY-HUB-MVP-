<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="../shared/js/utils/themeManager.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages | HandyHub</title>
  <link rel="stylesheet" href="css/messages.css" />

  <link rel='stylesheet' href='../shared/css/ui-polish.css' />
  <link rel='stylesheet' href='../shared/css/components/tabs.css' />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="ms-shell">

  <!-- ══════════════════════════════════
       LIST VIEW
  ══════════════════════════════════ -->
  <div class="ms-list-view" id="ms-list-view">

    <!-- Header -->
    <div class="ms-header">
      <h1 class="ms-title">Messages</h1>
      <div class="ms-header-btns">
        <button class="ms-icon-btn" aria-label="Search" onclick="focusSearch()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
            <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Search bar -->
    <div class="ms-search-wrap">
      <div class="ms-search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="#aaa" stroke-width="2"/>
          <path d="M16.5 16.5L21 21" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="ms-search-input" type="text" placeholder="Search messages…" oninput="searchConversations(this.value)" autocomplete="off" />
      </div>
    </div>

    <!-- Filter tabs — canonical ui-tabs (pill variant) -->
    <div class="ui-tabs ms-filter-bar" role="tablist">
      <button class="ui-tab active" role="tab" aria-selected="true"  onclick="filterTab('all', this)">All</button>
      <button class="ui-tab"        role="tab" aria-selected="false" onclick="filterTab('unread', this)">Unread</button>
    </div>

    <!-- Conversation list -->
    <div class="ms-conv-list" id="ms-conv-list">
      <div class="ms-empty"><p class="ms-empty-title">Loading…</p></div>
    </div>

  </div><!-- end ms-list-view -->


  <!-- ══════════════════════════════════
       CHAT VIEW
  ══════════════════════════════════ -->
  <div class="ms-chat-view" id="ms-chat-view">

    <!-- Chat header -->
    <div class="ms-chat-header">
      <button class="ms-chat-back" onclick="closeChat()" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M19 12H5M5 12l7 7M5 12l7-7" stroke="currentColor" stroke-width="2.0" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="ms-chat-pro-wrap">
        <img class="ms-chat-pro-avatar" id="chat-avatar"
          src="../shared/assets/icons/user-icon-white.png" alt="Artisan"
          onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23730201%22%3E%3Cpath d=%22M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z%22/%3E%3C/svg%3E'">
        <div class="ms-chat-pro-dot" id="chat-dot"></div>
      </div>
      <div class="ms-chat-pro-info">
        <p class="ms-chat-pro-name" id="chat-name">Name</p>
        <p class="ms-chat-pro-status" id="chat-status">Online</p>
      </div>
      <div class="ms-chat-actions">
        <button class="ms-icon-btn" aria-label="Call" onclick="callConversation()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 11.61 19a19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" stroke="#111" stroke-width="1.8"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Messages area -->
    <div class="ms-chat-body" id="ms-chat-body"></div>

    <!-- Input bar -->
    <div class="ms-input-bar">
      <button class="ms-input-attach" aria-label="Attach photo" onclick="document.getElementById('ms-attach-input').click()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <input type="file" id="ms-attach-input" accept="image/*" style="display:none" onchange="handleAttachmentSelect(event)" />
      <div class="ms-input-wrap">
        <textarea id="ms-msg-input" rows="1" placeholder="Type a message…"
          oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
      </div>
      <button class="ms-send-btn" onclick="sendMessage()" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

  </div><!-- end ms-chat-view -->

</div><!-- end ms-shell -->

<script src="../shared/js/utils/global-app.js"></script>
<script src="../shared/js/components/floatingNav.js"></script>
<script type="module">
import { requireAuth } from '../shared/js/utils/authGuard.js';
import { getAppContainer } from '../shared/js/app/container.js';
import { avatarUrl, uploadImage, UPLOAD_PRESETS } from '../shared/js/services/cloudinaryService.js';

const user = await requireAuth();
const uid  = user.uid;

const { repositories } = getAppContainer();
const { chatRepository, artisanRepository, customerRepository } = repositories;

const TOAST_ICONS = {
  success: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 7L10.25 16.75L6 12.5" stroke="currentColor" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  error: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 8V13" stroke="currentColor" stroke-width="2.0" stroke-linecap="round"/><path d="M12 16.5V16.55" stroke="currentColor" stroke-width="2.0" stroke-linecap="round"/><path d="M10.29 3.86L1.82 18A2 2 0 0 0 3.53 21H20.47A2 2 0 0 0 22.18 18L13.71 3.86A2 2 0 0 0 10.29 3.86Z" stroke="currentColor" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 10V16" stroke="currentColor" stroke-width="2.0" stroke-linecap="round"/><path d="M12 7.6V7.65" stroke="currentColor" stroke-width="2.0" stroke-linecap="round"/></svg>'
};

/* ── State ── */
let CHATS          = [];   // [{ id, data }] — live from chatRepository.subscribeByUser
const PARTICIPANT_CACHE = new Map(); // otherUid -> { name, avatarUrl, isOnline }
let currentChatId  = null;
let currentOtherUid = null;
let currentFilter  = 'all';
let unsubChats     = null;
let unsubMessages  = null;
let pendingAttachment = null;

function otherParticipant(chatData) {
  return (chatData.participants || []).find(p => p !== uid) || null;
}

/** Resolve display info (name/avatar/online) for the other participant.
 *  Tries artisanRepository first (the overwhelmingly common case — customer
 *  messaging an artisan), falls back to customerRepository (artisan-initiated
 *  or support thread edge case), cached per session. */
async function resolveParticipant(otherUid) {
  if (PARTICIPANT_CACHE.has(otherUid)) return PARTICIPANT_CACHE.get(otherUid);

  let info = { name: 'HandyHub User', photo: null, isOnline: false, phone: null };
  try {
    const a = await artisanRepository.getById(otherUid);
    if (a.exists) {
      const d = a.data;
      info = {
        name: d.name || 'Professional',
        photo: d.profileImageId ? avatarUrl(d.profileImageId, '', d.profileImageVersion ?? null) : (d.profileImage || null),
        isOnline: d.isAvailable === true || d.isOnline === true,
        phone: d.phone || null,
      };
      PARTICIPANT_CACHE.set(otherUid, info);
      return info;
    }
  } catch (e) { /* not an artisan — fall through */ }

  try {
    const c = await customerRepository.getById(otherUid);
    if (c.exists) {
      const d = c.data;
      info = {
        name: d.name || 'Customer',
        photo: d.profileImageId ? avatarUrl(d.profileImageId, '', d.profileImageVersion ?? null) : null,
        isOnline: false,
        phone: d.phone || null,
      };
    }
  } catch (e) { /* neither — keep default */ }

  PARTICIPANT_CACHE.set(otherUid, info);
  return info;
}

function initialsOf(name) {
  return (name || '?').split(' ').map(w => w[0] || '').join('').slice(0, 2).toUpperCase();
}

const GRADIENTS = [
  'linear-gradient(135deg,#1e3a5f,#2e5f8e)',
  'linear-gradient(135deg,#1a4731,#2e7d52)',
  'linear-gradient(135deg,#4a1a6e,#7b2fb5)',
  'linear-gradient(135deg,#5c3317,#9c6a38)',
];
function gradientFor(otherUid) {
  let hash = 0;
  for (let i = 0; i < otherUid.length; i++) hash = (hash * 31 + otherUid.charCodeAt(i)) >>> 0;
  return GRADIENTS[hash % GRADIENTS.length];
}

/* ── Render conversation list ── */
async function renderList(filter = 'all', searchQuery = '') {
  const list = document.getElementById('ms-conv-list');

  let chats = CHATS;
  if (filter === 'unread') chats = chats.filter(c => (c.data.unreadCount?.[uid] || 0) > 0);

  // Resolve participant info for every visible chat up front (cached after first load).
  const rows = await Promise.all(chats.map(async (c) => {
    const otherUid = otherParticipant(c.data);
    if (!otherUid) return null;
    const info = await resolveParticipant(otherUid);
    return { chat: c, otherUid, info };
  }));
  let visible = rows.filter(Boolean);

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    visible = visible.filter(r =>
      r.info.name.toLowerCase().includes(q) ||
      (r.chat.data.lastMessage || '').toLowerCase().includes(q)
    );
  }

  if (visible.length === 0) {
    list.innerHTML = `<div class="ms-empty">
      <div class="ms-empty-icon"><svg width="56" height="56" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z" stroke="#111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <p class="ms-empty-title">No messages yet</p>
      <p class="ms-empty-sub">Conversations with your professionals will appear here.</p>
    </div>`;
    return;
  }

  list.innerHTML = visible.map(({ chat, otherUid, info }) => {
    const unread = chat.data.unreadCount?.[uid] || 0;
    const time = chat.data.lastMessageAt ? timeAgoShort(chat.data.lastMessageAt) : '';
    return `
    <div class="ms-conv-item ${unread > 0 ? 'unread' : ''}" onclick="openChat('${chat.id}')">
      <div class="ms-conv-avatar-wrap">
        ${info.photo
          ? `<img class="ms-conv-avatar" src="${esc(info.photo)}" alt="${esc(info.name)}">`
          : `<div class="ms-conv-avatar-grad" style="background:${gradientFor(otherUid)}">${initialsOf(info.name)}</div>`
        }
        <div class="ms-conv-dot ${info.isOnline ? '' : 'offline'}"></div>
      </div>
      <div class="ms-conv-body">
        <div class="ms-conv-top">
          <span class="ms-conv-name">${esc(info.name)}</span>
          <span class="ms-conv-time">${time}</span>
        </div>
        <div class="ms-conv-bottom">
          <p class="ms-conv-preview">${esc(chat.data.lastMessage || 'No messages yet')}</p>
          ${unread > 0 ? `<span class="ms-conv-badge">${unread}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ── Open chat ── */
window.openChat = async function(chatId) {
  const chat = CHATS.find(c => c.id === chatId);
  if (!chat) return;
  currentChatId  = chatId;
  currentOtherUid = otherParticipant(chat.data);
  if (!currentOtherUid) return;

  const info = await resolveParticipant(currentOtherUid);

  const avatar = document.getElementById('chat-avatar');
  let grad = document.querySelector('.ms-chat-pro-avatar-grad');
  if (info.photo) {
    avatar.src = info.photo;
    avatar.style.display = 'block';
    if (grad) grad.style.display = 'none';
  } else {
    avatar.style.display = 'none';
    if (!grad) {
      grad = document.createElement('div');
      grad.className = 'ms-chat-pro-avatar-grad';
      avatar.parentNode.insertBefore(grad, avatar.nextSibling);
    }
    grad.style.display = 'flex';
    grad.style.background = gradientFor(currentOtherUid);
    grad.textContent = initialsOf(info.name);
  }
  document.getElementById('chat-name').textContent = info.name;
  const statusEl = document.getElementById('chat-status');
  statusEl.textContent = info.isOnline ? 'Online' : 'Offline';
  statusEl.className = 'ms-chat-pro-status' + (info.isOnline ? '' : ' offline');
  const dot = document.getElementById('chat-dot');
  dot.className = 'ms-chat-pro-dot' + (info.isOnline ? '' : ' offline');

  // Real-time message subscription
  if (unsubMessages) unsubMessages();
  unsubMessages = chatRepository.subscribeToMessages(
    chatId,
    (messages) => renderMessages(messages, info),
    (err) => console.error('[messages] subscribeToMessages error:', err)
  );

  // Mark thread read (zeroes badge, marks incoming messages isRead)
  chatRepository.markChatRead(chatId, uid).catch(() => {});

  document.getElementById('ms-list-view').classList.add('slide-out');
  document.getElementById('ms-chat-view').classList.add('slide-in');
  const fnav = document.getElementById('hh-floating-nav');
  if (fnav) fnav.style.display = 'none';
};

function renderMessages(messages, info) {
  const body = document.getElementById('ms-chat-body');
  body.innerHTML = `<div class="ms-date-sep"><span>Today</span></div>`;

  messages.forEach(m => {
    const msg = m.data;
    const isMine = msg.senderId === uid;
    const time = msg.createdAt ? new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    const bubbleContent = msg.attachment
      ? `<img src="${esc(msg.attachment.url)}" alt="Attachment" style="max-width:200px;border-radius:12px;display:block;">${msg.text ? `<div style="margin-top:6px;">${esc(msg.text)}</div>` : ''}`
      : esc(msg.text);
    body.innerHTML += `
      <div class="ms-bubble-wrap ${isMine ? 'mine' : 'theirs'}">
        ${!isMine
          ? (info.photo
              ? `<img class="ms-bubble-avatar" src="${esc(info.photo)}" alt="">`
              : `<div class="ms-bubble-avatar-grad" style="background:${gradientFor(currentOtherUid)}">${initialsOf(info.name)}</div>`)
          : ''}
        <div>
          <div class="ms-bubble ${isMine ? 'mine' : 'theirs'}">${bubbleContent}</div>
          <span class="ms-bubble-time">${time}</span>
        </div>
      </div>`;
  });

  scrollToBottom();
}

/* ── Close chat ── */
window.closeChat = function() {
  document.getElementById('ms-list-view').classList.remove('slide-out');
  document.getElementById('ms-chat-view').classList.remove('slide-in');
  const fnav = document.getElementById('hh-floating-nav');
  if (fnav) fnav.style.display = '';
  if (unsubMessages) { unsubMessages(); unsubMessages = null; }
  currentChatId = null;
  currentOtherUid = null;
  pendingAttachment = null;
};

/* ── Attachments ── */
window.handleAttachmentSelect = async function(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file || !currentChatId) return;
  try {
    showToast('Uploading photo…');
    // Reuses the 'job' preset — the closest semantic match for user-uploaded
    // photos exchanged during an active booking relationship. No dedicated
    // chat-attachment Cloudinary preset exists yet; if attachment volume
    // grows, create 'hh_chat_attachments' in the Cloudinary dashboard and
    // swap this constant.
    const { publicId, version } = await uploadImage(file, UPLOAD_PRESETS.job, {
      publicId: `chats/${currentChatId}/${Date.now()}`,
    });
    pendingAttachment = {
      url: avatarUrl(publicId, '', version),
      type: file.type,
      name: file.name,
      size: file.size,
    };
    await sendMessage();
  } catch (err) {
    showToast('Could not upload photo: ' + err.message, 'error');
  }
};

/* ── Send message ── */
window.sendMessage = async function() {
  const input = document.getElementById('ms-msg-input');
  const text = input.value.trim();
  if (!currentChatId || (!text && !pendingAttachment)) return;

  const attachment = pendingAttachment;
  pendingAttachment = null;
  input.value = '';
  input.style.height = 'auto';

  try {
    await chatRepository.sendMessage(currentChatId, {
      senderId: uid,
      text,
      senderName: user.displayName || undefined,
      attachment,
    });
  } catch (err) {
    showToast('Message failed to send: ' + err.message, 'error');
  }
};

/* ── Filter tabs ── */
window.filterTab = function(tab, btn) {
  currentFilter = tab;
  document.querySelectorAll('.ms-filter-bar .ui-tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected','false'); });
  btn.classList.add('active');
  btn.setAttribute('aria-selected','true');
  renderList(tab, document.getElementById('ms-search-input').value);
};

/* ── Search ── */
window.searchConversations = function(query) {
  renderList(currentFilter, query);
};

/* ── Helpers ── */
window.callConversation = async function() {
  if (!currentOtherUid) return;
  const info = await resolveParticipant(currentOtherUid);
  if (info.phone) {
    window.location.href = 'tel:' + info.phone;
  } else {
    showToast('No phone number on file for this contact');
  }
};

window.focusSearch = function() {
  document.getElementById('ms-search-input').focus();
};

function scrollToBottom() {
  const body = document.getElementById('ms-chat-body');
  requestAnimationFrame(() => { body.scrollTop = body.scrollHeight; });
}

window.autoResize = function(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
};

window.handleKey = function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
};

function timeAgoShort(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'Now';
  if (mins < 60) return `${mins}m`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return `${days}d`;
  return new Date(iso).toLocaleDateString('en-GH', { day: 'numeric', month: 'short' });
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type = 'info') {
  document.querySelector('.toast.app-toast')?.remove();

  const t = document.createElement('div');
  t.className = 'toast app-toast ' + type;
  t.setAttribute('role', 'status');
  t.setAttribute('aria-live', 'polite');
  t.setAttribute('aria-atomic', 'true');

  const icon = document.createElement('span');
  icon.className = 'toast-icon';
  icon.setAttribute('aria-hidden', 'true');
  icon.innerHTML = TOAST_ICONS[type] || TOAST_ICONS.info;

  const text = document.createElement('span');
  text.className = 'toast-message';
  text.textContent = msg;

  t.append(icon, text);
  document.body.appendChild(t);

  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => {
    t.classList.add('toast-exit');
    setTimeout(() => t.remove(), 320);
  }, 3000);
}

/* ── Deep-link: opened from artisan-profile.html "Message" button ──────────
 * sessionStorage.hh_msg_artisan = { id, name } — get-or-create the real
 * Firestore chat thread with that artisan and open it immediately. */
async function handleDeepLink() {
  const raw = sessionStorage.getItem('hh_msg_artisan');
  if (!raw) return;
  sessionStorage.removeItem('hh_msg_artisan');
  try {
    const { id: artisanId } = JSON.parse(raw);
    if (!artisanId) return;
    const chatId = await chatRepository.getOrCreateDirectChat(uid, artisanId);
    // Give the live subscription a moment to include the new/existing chat.
    await new Promise(r => setTimeout(r, 300));
    await openChat(chatId);
  } catch (e) {
    console.warn('[messages] deep-link open failed:', e.message);
  }
}

/* ── Init ── */
unsubChats = chatRepository.subscribeByUser(
  uid,
  (chats) => { CHATS = chats; renderList(currentFilter, document.getElementById('ms-search-input').value); },
  (err) => {
    console.error('[messages] subscribeByUser error:', err);
    document.getElementById('ms-conv-list').innerHTML =
      '<div class="ms-empty"><p class="ms-empty-title">Could not load messages</p></div>';
  }
);
handleDeepLink();
</script>
<script type="module" src="js/authInit.js"></script>
</body>
</html>
