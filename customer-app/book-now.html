<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="../shared/js/utils/themeManager.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Now | HandyHub</title>
  <link rel="stylesheet" href="../shared/css/ui-polish.css" />
  <style>
    /* ════════════════════════════════════════════════════════════════════════
       book-now.html — DECOMMISSIONED catch-all page (IA redesign, Phase C)
       --------------------------------------------------------------------------
       This page used to merge four user intentions (browse, research, emergency,
       book) into one screen. Those are now separate surfaces:
         • Service research      → service-detail.html?cat=
         • Professional browsing → professionals.html
         • Emergency dispatch    → book-emergency.html
         • Standard booking      → book-step1.html
       book-now.html is kept only as a thin intent-router so any old links,
       bookmarks, or in-flight sessionStorage handoffs still resolve correctly.
       It renders a brief splash, then forwards to the right destination.
       ════════════════════════════════════════════════════════════════════════ */
    body {
      margin: 0; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      background: var(--ui-bg, #fefefe);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .bn-redirect {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      color: var(--ui-muted, #666);
    }
    .bn-redirect-spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--ui-border, #eee);
      border-top-color: var(--ui-primary, #730201);
      border-radius: 50%;
      animation: bn-spin .65s linear infinite;
    }
    @keyframes bn-spin { to { transform: rotate(360deg); } }
    .bn-redirect-text { font-size: 14px; font-weight: 600; }
    html.dark body { background: #0f0f0f; }
  </style>
</head>
<body>
  <div class="bn-redirect" role="status" aria-live="polite">
    <div class="bn-redirect-spinner" aria-hidden="true"></div>
    <p class="bn-redirect-text">Finding the right place…</p>
  </div>

  <script type="module">
    // Intent router. Decide the destination from whatever context is present,
    // then forward. No UI decisions are made here anymore.
    import { requireAuth } from '../shared/js/utils/authGuard.js';
    await requireAuth();

    function dest() {
      const params = new URLSearchParams(location.search);

      // Explicit emergency intent (?em=1 or an em_service hint) → dispatch flow.
      const em = params.get('em');
      if (em === '1' || sessionStorage.getItem('hh_book_urgency') === 'asap') {
        return 'book-emergency.html';
      }

      // A specific professional was chosen upstream → professional-first booking.
      if (sessionStorage.getItem('hh_booking_intent') === 'artisan') {
        return 'book-step1.html';
      }

      // A service category is in play → let the customer browse pros for it.
      // (Browsing is the better default than forcing a blank booking form.)
      const svc = params.get('cat') || sessionStorage.getItem('hh_service');
      if (svc) {
        if (params.get('cat')) return `professionals.html?cat=${encodeURIComponent(params.get('cat'))}`;
        return 'professionals.html';
      }

      // No context at all → the standard booking entry.
      return 'book-step1.html';
    }

    window.location.replace(dest());
  </script>
</body>
</html>
