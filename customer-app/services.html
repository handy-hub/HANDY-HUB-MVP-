<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="../shared/js/utils/themeManager.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Popular Services | HandyHub</title>
  <!-- Same shell, header, card, skeleton and empty/error styles as the rest of
       the browse experience (professionals.html reuses these too). -->
  <link rel="stylesheet" href="css/book-now.css" />
  <link rel="stylesheet" href="../shared/css/ui-polish.css" />
  <link rel="stylesheet" href="../shared/css/components/tabs.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    /* Page-specific: category icon tile + count line + in-page search.
       Everything else (shell, header, card, skeleton, empty/error) is inherited
       from book-now.css so this page is visually identical to its siblings. */

    /* Category icon tile — same footprint/radius as the .bn2-pro-img avatar,
       expressed in brand tokens. */
    .svc-ico {
      width: 54px; height: 54px; flex-shrink: 0;
      border-radius: var(--ui-radius-md);
      background: var(--ui-primary-soft);
      color: var(--ui-primary);
      display: flex; align-items: center; justify-content: center;
    }
    .svc-ico svg { width: 26px; height: 26px; }

    /* Availability line — sits in the reused .bn2-pro-meta-row. Real data only. */
    .svc-count { font-size: 12px; font-weight: 700; color: var(--ui-primary); }
    .svc-count--muted { color: var(--ui-faint); font-weight: 600; }
    .svc-count.loading {
      color: transparent; min-width: 130px; border-radius: 6px;
      background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
      background-size: 200% 100%; animation: bn2Shimmer 1.5s ease infinite;
    }
    html.dark .svc-count.loading { background: linear-gradient(90deg,#242424 25%,#2e2e2e 50%,#242424 75%); background-size:200% 100%; }

    .svc-chev { flex-shrink: 0; color: var(--ui-faint); display: grid; place-items: center; }
    .svc-chev svg { width: 18px; height: 18px; }

    /* In-page search — filters the category list; never leaves the page. */
    .svc-search {
      overflow: hidden; max-height: 0; transition: max-height .2s ease;
      background: #fff; border-bottom: 1px solid #f0f0f0;
    }
    .svc-search.open { max-height: 64px; }
    html.dark .svc-search { background:#1e1e1e; border-color:#2e2e2e; }
    .svc-search-inner { display: flex; align-items: center; gap: 8px; padding: 10px 14px; }
    .svc-search-field {
      flex: 1; display: flex; align-items: center; gap: 8px;
      background: var(--ui-surface-2); border-radius: var(--ui-radius-sm);
      padding: 9px 12px; color: var(--ui-faint);
    }
    .svc-search-field input {
      flex: 1; border: none; background: none; outline: none;
      font-family: inherit; font-size: 14px; color: var(--ui-text);
    }
    .svc-inline-notice {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 14px 0; font-size: 12.5px; color: var(--ui-faint);
    }
  </style>
</head>
<body>
<div class="bn2-shell">

  <!-- ── Header (identical structure to professionals.html) ── -->
  <div class="bn2-header">
    <button class="bn2-back-btn" id="svc-back" aria-label="Go back" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M5 12l7 7M5 12l7-7" stroke="currentColor" stroke-width="2.0" stroke-linecap="round"/></svg>
    </button>
    <div class="bn2-header-center">
      <span class="bn2-header-title">Popular Services</span>
      <span class="bn2-header-sub">Browse every service, then pick a pro</span>
    </div>
    <div class="bn2-header-actions">
      <button class="bn2-icon-btn" id="svc-search-btn" aria-label="Search services" aria-expanded="false" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <!-- ── In-page search (filters the categories below; stays on this page) ── -->
  <div class="svc-search" id="svc-search">
    <div class="svc-search-inner">
      <div class="svc-search-field">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="svc-search-input" type="search" placeholder="Search services…" autocomplete="off" aria-label="Filter service categories" />
      </div>
    </div>
  </div>

  <!-- ── Scrollable content ── -->
  <div class="bn2-scroll">
    <div id="svc-notice"></div>
    <div id="svc-list" class="bn2-pros-list" style="padding-top:12px;" aria-live="polite"></div>
    <div style="height:90px"></div>
  </div>
</div>

<script src="../shared/js/utils/global-app.js"></script>
<script src="../shared/js/components/floatingNav.js"></script>

<script type="module">
  import { requireAuth } from '../shared/js/utils/authGuard.js';
  import { SERVICE_CATEGORIES } from '../shared/js/data/serviceCatalog.js';
  import { collection, query, where, getCountFromServer }
      from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
  import { firebaseDb } from '../shared/js/backend/providers/firebase/firebaseConfig.js';

  await requireAuth();

  const listEl   = document.getElementById('svc-list');
  const noticeEl  = document.getElementById('svc-notice');
  const searchEl  = document.getElementById('svc-search');
  const inputEl   = document.getElementById('svc-search-input');

  const CATS = Array.isArray(SERVICE_CATEGORIES) ? SERVICE_CATEGORIES : [];
  let _counts = null;      // { [id]: number }  — resolved live counts, or null while/if unavailable
  let _term   = '';

  const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // ── Live professional counts (real data only — no fabricated numbers) ───────
  // One Firestore aggregation per category on the `category` field (holds the
  // categoryLabel — see artisanRepository.findByCategory). Single-field equality
  // needs no composite index. If the lookup fails/times out, counts stay null and
  // the UI shows a neutral, non-numeric state — it NEVER invents a figure.
  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms)),
    ]);
  }
  async function fetchCounts() {
    const out = {};
    await Promise.all(CATS.map(async (c) => {
      const q = query(collection(firebaseDb, 'artisans'), where('category', '==', c.categoryLabel));
      const snap = await getCountFromServer(q);   // throws → caught by Promise.all rejection below
      out[c.id] = snap.data().count;
    }));
    return out;
  }

  // ── Count label (honest): real number, "joining soon" for a genuine 0, or a
  //    neutral "View professionals" when availability could not be loaded. ─────
  function countHtml(id) {
    if (_counts === null) return `<span class="svc-count svc-count--muted">View professionals</span>`;
    const n = _counts[id];
    if (!Number.isFinite(n)) return `<span class="svc-count svc-count--muted">View professionals</span>`;
    if (n === 0)            return `<span class="svc-count svc-count--muted">Professionals joining soon</span>`;
    return `<span class="svc-count">${n} professional${n !== 1 ? 's' : ''} available</span>`;
  }

  const CHEVRON = '<svg viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // Reuses the .bn2-pro-card shell so the row is visually identical to the
  // professional cards elsewhere in the app.
  function cardHtml(c) {
    const countInner = _counts === undefined
      ? '<span class="svc-count loading">…</span>'   // still loading
      : countHtml(c.id);
    return `
      <div class="bn2-pro-card" role="button" tabindex="0" data-cat="${esc(c.id)}"
           aria-label="Browse ${esc(c.name)} professionals">
        <div class="svc-ico" aria-hidden="true">${c.icon || ''}</div>
        <div class="bn2-pro-body">
          <p class="bn2-pro-name">${esc(c.name)}</p>
          <p class="bn2-pro-spec">${esc(c.blurb || '')}</p>
          <div class="bn2-pro-meta-row">${countInner}</div>
        </div>
        <div class="svc-chev" aria-hidden="true">${CHEVRON}</div>
      </div>`;
  }

  // ── States (reuse the app's skeleton / empty / error markup) ────────────────
  function showSkeletons() {
    listEl.innerHTML = '<div class="bn2-pro-skeleton"></div>'.repeat(4);
    noticeEl.innerHTML = '';
  }
  function showEmpty(msg) {
    listEl.innerHTML = `
      <div class="bn2-pros-empty">
        <div class="bn2-pros-empty-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#bbb" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="#bbb" stroke-width="2" stroke-linecap="round"/></svg></div>
        <p class="bn2-pros-empty-title">${esc(msg || 'No services found')}</p>
        <p class="bn2-pros-empty-sub">Try a different search term.</p>
      </div>`;
  }
  function showError() {
    listEl.innerHTML = `
      <div class="bn2-pros-empty">
        <div class="bn2-pros-empty-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#bbb" stroke-width="2"/><path d="M12 8v5M12 16v1" stroke="#bbb" stroke-width="2" stroke-linecap="round"/></svg></div>
        <p class="bn2-pros-empty-title">Couldn't load services</p>
        <p class="bn2-pros-empty-sub">Check your connection and <button class="bn2-inline-retry" id="svc-retry">try again</button>.</p>
      </div>`;
    document.getElementById('svc-retry')?.addEventListener('click', load);
  }

  // ── Render the (optionally filtered) category list ──────────────────────────
  function render() {
    const term = _term.trim().toLowerCase();
    const cats = term
      ? CATS.filter(c => (c.name + ' ' + c.categoryLabel + ' ' + (c.blurb || '')).toLowerCase().includes(term))
      : CATS;

    if (!cats.length) { showEmpty(term ? `No services match “${_term.trim()}”` : 'No services found'); return; }

    listEl.innerHTML = cats.map(cardHtml).join('');
    listEl.querySelectorAll('.bn2-pro-card').forEach((card) => {
      const go = () => {
        const id = card.getAttribute('data-cat');
        // DISCOVERY, not commitment: open the filtered professionals list.
        window.location.href = `professionals.html?cat=${encodeURIComponent(id)}`;
      };
      card.addEventListener('click', go);
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
      });
    });

    // If availability couldn't be loaded, offer a non-blocking retry.
    noticeEl.innerHTML = (_counts === null && !term)
      ? `<div class="svc-inline-notice">Couldn't load availability · <button class="bn2-inline-retry" id="svc-counts-retry">Retry</button></div>`
      : '';
    document.getElementById('svc-counts-retry')?.addEventListener('click', loadCounts);
  }

  // ── Load counts (with timeout); render is honest whatever the outcome ───────
  async function loadCounts() {
    _counts = undefined;                 // loading
    render();                            // shows count shimmers
    try {
      _counts = await withTimeout(fetchCounts(), 6000);
    } catch {
      _counts = null;                    // timeout / offline / error → neutral, no fake data
    }
    render();
  }

  async function load() {
    if (!CATS.length) { showError(); return; }   // catalog unavailable (defensive)
    showSkeletons();
    // The category list is static and always available — paint it fast, then
    // enrich with live availability counts.
    _counts = undefined;
    render();
    await loadCounts();
  }

  // ── In-page search ──────────────────────────────────────────────────────────
  document.getElementById('svc-search-btn').addEventListener('click', () => {
    const open = searchEl.classList.toggle('open');
    document.getElementById('svc-search-btn').setAttribute('aria-expanded', String(open));
    if (open) { inputEl.focus(); }
    else { inputEl.value = ''; _term = ''; render(); }
  });
  inputEl.addEventListener('input', () => { _term = inputEl.value; render(); });

  // ── Header back (referrer-aware, same as professionals.html) ────────────────
  document.getElementById('svc-back').addEventListener('click', () => {
    if (document.referrer && document.referrer.indexOf(location.host) !== -1) history.back();
    else window.location.href = 'dashboard.html';
  });

  load();
</script>
</body>
</html>
