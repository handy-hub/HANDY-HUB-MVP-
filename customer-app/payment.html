<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay | HandyHub</title>
<!--
  RETIRED — this was a SECOND wallet top-up surface.

  topup.html is the canonical one: it is what the booking flow opens when a
  customer needs funds (customer-app/js/pages/bookRequestPage.js), and what the
  wallet links to. Nothing in either app ever linked here — traced across all
  pages, notification actionUrls, the service worker, the web manifest, Firebase
  Hosting rewrites and the functions source. Paystack is popup-only and no
  callback_url exists anywhere in the codebase.

  Kept as a redirect rather than deleted for one reason: a callback URL could be
  configured in the Paystack DASHBOARD, which is not visible from this repo. A
  stub costs nothing and cannot strand a real payment; a deletion could.
  Any ?paymentId= is carried across so a resumed payment still resolves.
-->
<script>
  (function () {
    var q = location.search || '';
    location.replace('topup.html' + q);
  })();
</script>
</head>
<body></body>
</html>
