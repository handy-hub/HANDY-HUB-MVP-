<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Flat brand-monochrome cleaning icon (bucket + mop) — normalised to match
       the maroon line-icon family used by the other service categories.
       Previous asset was a green/brown full-colour illustration (design drift). -->
  <g stroke="#730201" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Bucket -->
    <path d="M20 28h24l-3 18a2 2 0 0 1-2 1.7H25a2 2 0 0 1-2-1.7L20 28z"/>
    <!-- Bucket rim handle -->
    <path d="M23 28c0-6 18-6 18 0"/>
    <!-- Mop handle -->
    <line x1="46" y1="16" x2="37" y2="36"/>
    <!-- Mop strands -->
    <path d="M31 37c1.6 3 3.2 3 4.8 0 1.6 3 3.2 3 4.8 0"/>
  </g>
</svg>
