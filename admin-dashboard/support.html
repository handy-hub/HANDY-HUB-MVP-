<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fidus X Admin – Support</title>
  <link rel="stylesheet" href="css/admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .tk-list{display:flex;flex-direction:column;gap:10px;}
    .tk-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg,16px);padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;}
    .tk-row:hover{box-shadow:var(--shadow-md);}
    .tk-title{font-size:14px;font-weight:700;color:var(--text-dark);margin:0;}
    .tk-sub{font-size:12px;color:var(--text-mid);margin:2px 0 0;}
    .tk-snippet{font-size:12px;color:var(--text-light);margin:6px 0 0;max-width:640px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .tk-panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;}
    .tk-panel-overlay.open{display:flex;}
    .tk-panel{background:var(--surface);border-radius:20px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;}
    .tk-panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
    .tk-panel-body{padding:16px 20px;}
    .tk-msg{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
    .tk-msg.support{border-left:3px solid var(--brand);}
    .tk-msg-head{font-size:11px;font-weight:700;color:var(--text-dark);margin:0 0 4px;}
    .tk-msg-body{font-size:13px;color:var(--text-mid);margin:0;white-space:pre-wrap;line-height:1.5;}
    .tk-reply{width:100%;min-height:90px;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;font:13px 'Inter',sans-serif;box-sizing:border-box;}
    .tk-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
    .tk-btn{background:var(--brand);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
    .tk-btn.secondary{background:var(--surface-2);color:var(--text-mid);border:1.5px solid var(--border);}
    .tk-btn:disabled{opacity:.45;cursor:not-allowed;}
  </style>
</head>
<body>
<div class="admin-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="#fff" stroke-width="2" stroke-linecap="round"/><polyline points="9 22 9 12 15 12 15 22" stroke="#fff" stroke-width="2"/></svg></div>
      <span class="sidebar-logo-text">Fidus X</span><span class="sidebar-logo-badge">Admin</span>
    </div>
    <div class="sidebar-section-label">Main</div>
    <a class="nav-link" href="index.html"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/></svg>Overview</a>
    <a class="nav-link" href="analytics.html"><svg viewBox="0 0 24 24" fill="none"><line x1="18" y1="20" x2="18" y2="10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="12" y1="20" x2="12" y2="4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="6" y1="20" x2="6" y2="14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Analytics</a>
    <div class="sidebar-section-label">Users</div>
    <a class="nav-link" href="artisans.html"><svg viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/></svg>Artisans</a>
    <a class="nav-link" href="customers.html"><svg viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/></svg>Customers</a>
    <a class="nav-link" href="verifications.html"><svg viewBox="0 0 24 24" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Verifications<span class="nav-badge" id="verif-badge">0</span></a>
    <div class="sidebar-section-label">Operations</div>
    <a class="nav-link" href="bookings.html"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Bookings</a>
    <a class="nav-link" href="disputes.html"><svg viewBox="0 0 24 24" fill="none"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="12" y1="9" x2="12" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Disputes</a>
    <a class="nav-link active" href="support.html"><svg viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Support</a>
    <div class="sidebar-section-label">Marketing</div>
    <a class="nav-link" href="promotions.html"><svg viewBox="0 0 24 24" fill="none"><path d="M3 11l18-5v12L3 14v-3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M11.6 16.8a3 3 0 0 1-5.8-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Promotions</a>
    <div class="sidebar-section-label">Finance</div>
    <a class="nav-link" href="finance.html"><svg viewBox="0 0 24 24" fill="none"><line x1="12" y1="1" x2="12" y2="23" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Finance</a>
    <a class="nav-link" href="payouts.html"><svg viewBox="0 0 24 24" fill="none"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" stroke="currentColor" stroke-width="1.8"/></svg>Payouts</a>
    <div class="sidebar-section-label">System</div>
    <a class="nav-link" href="admins.html"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M20 21a8 8 0 1 0-16 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16 11h6M19 8v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Admin Users</a>
    <a class="nav-link" href="settings.html"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="1.8"/></svg>Settings</a>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="admin-avatar">A</div>
        <div class="sidebar-user-info"><p class="sidebar-user-name" id="admin-name">Admin</p><p class="sidebar-user-role">Super Admin</p></div>
        <button onclick="signOut()" style="background:none;border:none;cursor:pointer;margin-left:8px;color:#64748B;" title="Sign out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-content">
    <header class="admin-header">
      <div class="header-left">
        <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')"><svg viewBox="0 0 24 24" fill="none"><line x1="3" y1="6" x2="21" y2="6" stroke="#374151" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="12" x2="21" y2="12" stroke="#374151" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="18" x2="21" y2="18" stroke="#374151" stroke-width="2" stroke-linecap="round"/></svg></button>
        <span class="page-title-bar">Support Requests</span>
      </div>
      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="#94A3B8" stroke-width="1.8"/><path d="m21 21-4.35-4.35" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="text" placeholder="Search name, email, message…" id="search-input" oninput="handleSearch(this.value)" />
      </div>
      <div class="header-actions">
        <button class="header-icon-btn" onclick="window.location.href='verifications.html'"><svg viewBox="0 0 24 24" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="#374151" stroke-width="1.8" stroke-linecap="round"/></svg><span class="header-badge" id="hdr-verif-badge" style="display:none">0</span></button>
        <span style="font-size:12px;color:var(--text-light);padding:0 4px;">|</span>
        <span id="hdr-date" style="font-size:12px;color:var(--text-light);white-space:nowrap;"></span>
      </div>
    </header>

    <div class="page-body">
      <!-- AR-11: tickets raised in the artisan (and customer) apps used to be
           written to support_tickets and read by nobody. This is where they are
           answered. Access is enforced by firestore.rules (support_admin). -->
      <div class="table-toolbar" style="margin-bottom:16px;">
        <div class="filter-chips">
          <button class="filter-chip active" data-filter="active" onclick="setFilter('active')">Needs attention</button>
          <button class="filter-chip" data-filter="open"        onclick="setFilter('open')">Open</button>
          <button class="filter-chip" data-filter="in_progress" onclick="setFilter('in_progress')">In progress</button>
          <button class="filter-chip" data-filter="answered"    onclick="setFilter('answered')">Answered</button>
          <button class="filter-chip" data-filter="closed"      onclick="setFilter('closed')">Closed</button>
          <button class="filter-chip" data-filter="all"         onclick="setFilter('all')">All</button>
        </div>
      </div>
      <p id="tk-state" style="font-size:13px;color:var(--text-light);">Loading support requests…</p>
      <div class="tk-list" id="tk-list"></div>
    </div>
  </div>
</div>

<div class="tk-panel-overlay" id="tk-overlay" onclick="if(event.target===this) closeTicket()">
  <div class="tk-panel" role="dialog" aria-modal="true" aria-labelledby="tk-p-title">
    <div class="tk-panel-head">
      <div><p class="tk-title" id="tk-p-title">Request</p><p class="tk-sub" id="tk-p-sub"></p></div>
      <button class="tk-btn secondary" onclick="closeTicket()" aria-label="Close">Close</button>
    </div>
    <div class="tk-panel-body">
      <div id="tk-p-thread"></div>
      <textarea class="tk-reply" id="tk-p-reply" placeholder="Write a reply to the user…"></textarea>
      <div class="tk-actions">
        <button class="tk-btn" id="tk-p-send" onclick="sendReply()">Send reply</button>
        <button class="tk-btn secondary" onclick="setStatus('in_progress')">Mark in progress</button>
        <button class="tk-btn secondary" onclick="setStatus('closed')">Close request</button>
        <button class="tk-btn secondary" onclick="setStatus('open')">Reopen</button>
      </div>
      <p id="tk-p-error" role="alert" style="display:none;font-size:12px;color:var(--danger);margin-top:8px;"></p>
    </div>
  </div>
</div>

<script type="module">
import { db } from './js/firebase-admin.js';
import { initAdminPage, signOutAdmin } from './js/auth-guard.js';
import { showToast, esc, ageStr, subscribeVerifBadge, setDateHeader } from './js/ui-utils.js';
import { collection, doc, onSnapshot, addDoc, updateDoc }
  from '../shared/vendor/firebase/firebase-firestore.js';
import { TICKET_STATUS, validateReply, ticketStatusLabel, topicLabel }
  from '../shared/js/domain/supportTickets.js';

let _user = null, _tickets = [], _filter = 'active', _query = '', _active = null, _threadUnsub = null;

window.signOut = signOutAdmin;

initAdminPage(user => {
  _user = user;
  setDateHeader();
  subscribeVerifBadge();
  onSnapshot(collection(db, 'support_tickets'), snap => {
    _tickets = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => String(b.updatedAt || b.createdAt).localeCompare(String(a.updatedAt || a.createdAt)));
    render();
  }, err => {
    document.getElementById('tk-state').textContent = /permission/i.test(err?.code || err?.message || '')
      ? 'Your admin account does not have support access (role support_admin or super_admin).'
      : 'Could not load support requests. Check your connection.';
  });
});

function render() {
  const q = _query.toLowerCase();
  const rows = _tickets.filter(t => {
    if (_filter === 'active' && !['open', 'in_progress'].includes(t.status)) return false;
    if (!['active', 'all'].includes(_filter) && t.status !== _filter) return false;
    if (q && ![t.userName, t.userEmail, t.message, t.subject].some(v => String(v || '').toLowerCase().includes(q))) return false;
    return true;
  });
  document.getElementById('tk-state').textContent = rows.length ? '' : 'No requests here.';
  document.getElementById('tk-list').innerHTML = rows.map(t => `
    <div class="tk-row" onclick="openTicket('${esc(t.id)}')">
      <div>
        <p class="tk-title">${esc(topicLabel(t.subject))} · ${esc(t.role || '')}</p>
        <p class="tk-sub">${esc(t.userName || 'Unnamed')} · ${esc(t.userEmail || '')}</p>
        <p class="tk-snippet">${esc(t.message || '')}</p>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <span class="badge ${t.status === 'open' ? 'badge-warning' : t.status === 'closed' ? 'badge-default' : 'badge-info'}">${esc(ticketStatusLabel(t.status, 'support'))}</span>
        <p class="tk-sub">${esc(ageStr(new Date(t.updatedAt || t.createdAt)))}</p>
      </div>
    </div>`).join('');
}

window.setFilter = f => {
  _filter = f;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === f));
  render();
};
window.handleSearch = v => { _query = v || ''; render(); };

window.openTicket = id => {
  _active = _tickets.find(t => t.id === id) || null;
  if (!_active) return;
  document.getElementById('tk-p-title').textContent = `${topicLabel(_active.subject)} · ${ticketStatusLabel(_active.status, 'support')}`;
  document.getElementById('tk-p-sub').textContent = `${_active.userName || 'Unnamed'} · ${_active.userEmail || ''} · ${_active.role || ''}`;
  document.getElementById('tk-p-error').style.display = 'none';
  document.getElementById('tk-overlay').classList.add('open');
  const thread = document.getElementById('tk-p-thread');
  const first = `<div class="tk-msg"><p class="tk-msg-head">${esc(_active.userName || 'User')} · ${esc(new Date(_active.createdAt).toLocaleString())}</p><p class="tk-msg-body">${esc(_active.message)}</p></div>`;
  thread.innerHTML = first;
  if (_threadUnsub) _threadUnsub();
  _threadUnsub = onSnapshot(collection(db, 'support_tickets', id, 'messages'), snap => {
    const msgs = snap.docs.map(d => d.data()).sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
    thread.innerHTML = first + msgs.map(m => `
      <div class="tk-msg ${m.authorRole === 'support' ? 'support' : ''}">
        <p class="tk-msg-head">${m.authorRole === 'support' ? 'Support' : esc(_active.userName || 'User')} · ${esc(new Date(m.createdAt).toLocaleString())}</p>
        <p class="tk-msg-body">${esc(m.body)}</p>
      </div>`).join('');
  }, () => {});
};

window.closeTicket = () => {
  document.getElementById('tk-overlay').classList.remove('open');
  if (_threadUnsub) { _threadUnsub(); _threadUnsub = null; }
  _active = null;
};

function showError(msg) {
  const el = document.getElementById('tk-p-error');
  el.textContent = msg;
  el.style.display = '';
}

window.sendReply = async () => {
  if (!_active || !_user) return;
  const ta = document.getElementById('tk-p-reply');
  const v = validateReply(ta.value);
  if (!v.ok) { showError(v.error); return; }
  const btn = document.getElementById('tk-p-send');
  btn.disabled = true;
  const t = _active, now = new Date().toISOString();
  try {
    await addDoc(collection(db, 'support_tickets', t.id, 'messages'), {
      authorId: _user.uid, authorRole: 'support', body: ta.value.trim(), createdAt: now,
    });
    await updateDoc(doc(db, 'support_tickets', t.id), {
      status: TICKET_STATUS.ANSWERED, lastReplyAt: now, lastReplyBy: 'support', updatedAt: now,
    });
    // Tell the user where to read it. Their notification inbox is the one place
    // both apps already show; the reply itself lives on the support thread.
    await addDoc(collection(db, 'customer_notifications'), {
      receiverId: t.userId, senderId: _user.uid, type: 'System',
      title: 'Support replied to your request',
      message: `There is a reply to your request about "${topicLabel(t.subject)}". Open Support to read it.`,
      isRead: false, readAt: null, actionUrl: t.role === 'artisan' ? 'support.html' : null,
      metadata: { ticketId: t.id }, createdAt: now,
    }).catch(() => showToast('Reply saved, but the user could not be notified.', 'error'));
    ta.value = '';
    showToast('Reply sent.', 'success');
  } catch (e) {
    showError(/permission/i.test(e?.code || e?.message || '')
      ? 'Your admin account does not have support access.'
      : 'The reply was not sent — check your connection and try again.');
  } finally {
    btn.disabled = false;
  }
};

window.setStatus = async status => {
  if (!_active) return;
  const now = new Date().toISOString();
  try {
    await updateDoc(doc(db, 'support_tickets', _active.id), {
      status, updatedAt: now, ...(status === TICKET_STATUS.CLOSED ? { closedAt: now } : {}),
    });
    showToast(`Marked ${ticketStatusLabel(status, 'support').toLowerCase()}.`, 'success');
    document.getElementById('tk-p-title').textContent = `${topicLabel(_active.subject)} · ${ticketStatusLabel(status, 'support')}`;
  } catch (e) {
    showError('Could not change the status. Check your connection and permissions.');
  }
};
</script>
</body>
</html>
