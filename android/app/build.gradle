apply plugin: 'com.android.application'

android {
    namespace = "com.handyhub.customer"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.handyhub.customer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Native Google sign-in (GoogleSignInPlugin): the web OAuth flow cannot run
    // inside the WebView, so the account is chosen through Credential Manager.
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Firebase native config is REQUIRED, not optional. The app calls
// PushNotifications.register() right after sign-in; that calls
// FirebaseMessaging.getInstance(), which throws "Default FirebaseApp is not
// initialized" when this file was missing at build time, and Capacitor's bridge
// re-throws plugin exceptions on its own thread — the whole app closes on every
// login. Capacitor's template only logged this at info level (invisible), so a
// crashing APK built "successfully". Fail the build instead.
def servicesJSON = file('google-services.json')
def servicesPackages = servicesJSON.exists()
    ? new groovy.json.JsonSlurper().parse(servicesJSON).client.collect { it.client_info?.android_client_info?.package_name }
    : []
if (!servicesPackages.contains(android.defaultConfig.applicationId)) {
    throw new GradleException(
        "android/app/google-services.json is missing or has no client for ${android.defaultConfig.applicationId}. " +
        "Download it from Firebase Console (project lamax-4fd82) → Project settings → Android app. " +
        "Without it the app closes on login (PushNotifications.register → FirebaseApp not initialized).")
}
apply plugin: 'com.google.gms.google-services'
