<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#F97316" />
  <title>Help and support | Fidus X for professionals</title>
  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/fx/support.css" />
</head>
<body class="fx-app">
<a class="fx-skip" href="#sp-main">Skip to content</a>
<div class="fx-shell">
  <!-- Help: answers that state what the product does today, the support
       channels the owner has confirmed are staffed (shared/js/config/
       supportConfig.js), a request to the team, and the artisan's requests with
       their conversations (support_tickets; firestore.rules AR-11). -->
  <header class="fx-appbar fx-appbar--push">
    <button class="fx-iconbtn" type="button" id="sp-back" aria-label="Back"><span data-icon="back"></span></button>
    <div class="fx-appbar__titles"><p class="fx-appbar__title">Help and support</p></div>
  </header>

  <main class="fx-main" id="sp-main" tabindex="-1">
    <h1 class="fx-sr">Help and support</h1>
    <p class="fx-sup__lead" id="sp-hero-sub">Send us a request below. The reply appears on this page and in your notifications.</p>

    <!-- Contact channels — only those the owner has confirmed are staffed. No placeholder numbers. -->
    <section class="fx-sect" aria-labelledby="sp-contact-label" id="sp-contact" hidden>
      <div class="fx-sect__head"><h2 class="fx-sect__title" id="sp-contact-label">Contact us</h2></div>
      <ul class="fx-list" id="sp-contact-list"></ul>
    </section>

    <section class="fx-sect" aria-labelledby="sp-faq-label">
      <div class="fx-sect__head"><h2 class="fx-sect__title" id="sp-faq-label">Frequently asked questions</h2></div>
      <div class="fx-sect__body"><div class="fx-sup__faqs" id="faq-list"></div></div>
    </section>

    <section class="fx-sect" aria-labelledby="sp-form-label">
      <div class="fx-sect__head"><h2 class="fx-sect__title" id="sp-form-label">Send a message</h2></div>
      <form class="fx-sect__body fx-sup__form" id="sp-form" novalidate>
        <div class="fx-field">
          <label class="fx-field__label" for="sp-subject">Topic</label>
          <div class="fx-select">
            <select class="fx-input" id="sp-subject"><option value="">Choose a topic</option></select>
            <span data-icon="down" data-icon-class="fx-select__chev"></span>
          </div>
        </div>
        <div class="fx-field">
          <label class="fx-field__label" for="sp-message">Your message</label>
          <textarea class="fx-input" id="sp-message" rows="5" aria-describedby="sp-message-hint sp-form-error" placeholder="Describe your issue in detail…"></textarea>
          <p class="fx-field__hint" id="sp-message-hint"></p>
        </div>
        <p class="fx-sup__error" id="sp-form-error" role="alert"></p>
        <button class="fx-btn fx-btn--primary fx-btn--l fx-btn--block" type="submit" id="sp-submit-btn">Send message</button>
      </form>
    </section>

    <!-- Your requests: status and the conversation with support -->
    <section class="fx-sect" aria-labelledby="sp-tickets-label">
      <div class="fx-sect__head"><h2 class="fx-sect__title" id="sp-tickets-label">Your requests</h2></div>
      <div class="fx-sect__body">
        <div class="fx-sup__tickets" id="sp-tickets"><p class="fx-sup__state" id="sp-tickets-state" aria-live="polite">Loading your requests…</p></div>
      </div>
    </section>

    <p class="fx-sup__foot" id="sp-version">Fidus X for professionals</p>
  </main>

  <div class="fx-bottom">
    <nav class="fx-tabbar" aria-label="Main" id="tabbar"></nav>
  </div>
</div>

<script type="module">
import '../shared/js/utils/global-app.js';
import { icon }               from './js/fx/icons.js';
import { showToast as toast } from './js/fx/toast.js';
import { renderTabbar }       from './js/fx/controls.js';
import { getAppContainer }    from '../shared/js/app/container.js';
import { requireArtisanAuth } from './js/utils/artisanAuthGuard.js';
import { createNotification } from '../shared/js/services/notificationRepository.js';
import { SUPPORT_CONTACTS }   from '../shared/js/config/supportConfig.js';
import { PLATFORM_CONFIG }    from '../shared/js/config/appConfig.js';
import { TICKET_STATUS, TICKET_TOPICS, TICKET_LIMITS, validateTicket, validateReply, ticketStatusLabel, topicLabel }
                              from '../shared/js/domain/supportTickets.js';
import { mountInstantView }   from '../shared/js/services/instantView.js';

for (const el of document.querySelectorAll('[data-icon]')) el.outerHTML = icon(el.dataset.icon, el.dataset.iconClass || '');
renderTabbar(document.getElementById('tabbar'), { current: 'account' });
// Back where the artisan came from (Account, or a job's "Get help with this job").
document.getElementById('sp-back').addEventListener('click', () => {
  if (history.length > 1 && document.referrer.indexOf(location.origin + '/') === 0) history.back();
  else window.location.href = 'settings.html';
});
// One list of topics and one length rule: the ones the rules and admin use.
for (const t of TICKET_TOPICS) document.getElementById('sp-subject').add(new Option(t.label, t.id));
document.getElementById('sp-message-hint').textContent = `${TICKET_LIMITS.messageMin} to ${TICKET_LIMITS.messageMax} characters.`;

const { user, artisan } = await requireArtisanAuth({ allowPending: true });

// ── Help with a specific job ───────────────────────────
// job.html sends approved work here ("Get help with this job"): once a quote is
// approved the server refuses an artisan cancellation, and Support is the route
// out (Phase 0 WF-01). The booking reference is pre-filled so the team knows
// which job; it travels in the message text, the ticket's own fields unchanged.
{
  const ref = new URLSearchParams(location.search).get('bookingId') || '';
  if (/^[A-Za-z0-9_-]{4,64}$/.test(ref)) {
    const subject = document.getElementById('sp-subject');
    const message = document.getElementById('sp-message');
    if (subject && !subject.value) subject.value = 'booking';
    if (message && !message.value) message.value = `About booking ${ref}: `;
  }
}

// ── FAQ data ───────────────────────────────────────────
// Every answer states what the product does today. The figures come from
// PLATFORM_CONFIG, which tests/config-consistency.test.cjs pins to the values
// the server enforces (functions/config.js).
const COMMISSION_PCT = Math.round(PLATFORM_CONFIG.commissionRate * 100);
const MIN_WITHDRAWAL = PLATFORM_CONFIG.minWithdrawalGHS;
const FAQS = [
  {
    q: 'How do I get paid for completed jobs?',
    a: 'Earnings are held in escrow during the job. Once the customer confirms completion (or automatically after 7 days if there is no dispute), funds are released to your Fidus X wallet. You can withdraw anytime to MoMo, Telecel Cash, or AirtelTigo Money.'
  },
  {
    q: 'Why can\'t I go online?',
    a: 'You need an approved application before you can go online. On Today, tap "Complete verification" (or open Verification in Account) to send your documents. An administrator reviews them and you get a notification when there is a decision.'
  },
  {
    q: 'What happens if I miss a job request?',
    a: 'If you don\'t respond to a job within the countdown timer, it will be reassigned to another artisan. Frequent missed requests may lower your response rate score, which affects how often you\'re dispatched jobs.'
  },
  {
    q: 'How is the platform fee calculated?',
    a: `Fidus X charges a ${COMMISSION_PCT}% commission on completed job earnings. It is deducted automatically before the funds reach your wallet, and Earnings shows each job's price and the commission taken.`
  },
  {
    q: 'Can I cancel a booking I already accepted?',
    a: 'Before the customer approves your quote, yes: open the job from Jobs and tap "Cancel job" — the confirmation tells you what it means for the customer. Once a quote is approved, the app cannot cancel it: tap "Get help with this job" and Fidus X will help. The customer is relying on you, so cancel only when you must.'
  },
  {
    q: 'How do I withdraw my earnings?',
    a: `Go to Earnings, tap "Withdraw", enter the amount and your security PIN. The money goes only to the payout account on file, and Earnings shows the withdrawal's status until it completes. Minimum withdrawal is GHS ${MIN_WITHDRAWAL}.`
  },
];

const faqList = document.getElementById('faq-list');
for (const f of FAQS) {
  const d = document.createElement('details');
  d.className = 'fx-sup__faq';
  d.innerHTML = `<summary><span></span>${icon('down')}</summary><p></p>`;
  d.querySelector('summary > span').textContent = f.q;
  d.querySelector('p').textContent = f.a;
  faqList.appendChild(d);
}

// ── Contact channels (only confirmed ones) ─────────────
// shared/js/config/supportConfig.js is empty until the owner confirms which
// channels are staffed; nothing is shown that nobody answers.
(function renderContacts() {
  const list = document.getElementById('sp-contact-list');
  const cards = [];
  const card = (href, title, sub, ext) => `
    <li><a class="fx-row" href="${esc(href)}"${ext ? ' target="_blank" rel="noopener"' : ''}>
      <span class="fx-row__main"><span class="fx-row__title">${esc(title)}</span><span class="fx-row__meta">${esc(sub)}</span></span>
      <span class="fx-row__trail">${icon('next')}</span></a></li>`;
  if (SUPPORT_CONTACTS.email)    cards.push(card(`mailto:${SUPPORT_CONTACTS.email}`, 'Email support', SUPPORT_CONTACTS.email));
  if (SUPPORT_CONTACTS.whatsapp) cards.push(card(`https://wa.me/${SUPPORT_CONTACTS.whatsapp}`, 'WhatsApp', 'Chat with us', true));
  if (SUPPORT_CONTACTS.phone)    cards.push(card(`tel:${SUPPORT_CONTACTS.phone}`, 'Call us', SUPPORT_CONTACTS.phone));
  if (cards.length) {
    list.innerHTML = cards.join('');
    document.getElementById('sp-contact').hidden = false;
  }
  if (SUPPORT_CONTACTS.hours) {
    document.getElementById('sp-hero-sub').textContent += ` Support hours: ${SUPPORT_CONTACTS.hours}.`;
  }
})();

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function showToast(msg, tone = 'info') { toast(msg, { tone }); }

const { services: { databaseService } } = getAppContainer();

// ── Submit a request ───────────────────────────────────
// The ticket is written FIRST. The acknowledgement used to be sent before it,
// so a failed write still told the artisan their message had been received,
// and it promised a reply "within 2 hours" that no process stood behind.
let sending = false;
async function submitTicket() {
  if (sending) return;
  const subject = document.getElementById('sp-subject').value;
  const message = document.getElementById('sp-message').value.trim();
  const errEl   = document.getElementById('sp-form-error');
  errEl.textContent = '';

  const v = validateTicket({ subject, message });
  if (!v.ok) {
    errEl.textContent = v.error;
    document.getElementById(subject ? 'sp-message' : 'sp-subject').focus();
    return;
  }

  const btn = document.getElementById('sp-submit-btn');
  sending = true;
  btn.setAttribute('aria-busy', 'true');
  btn.textContent = 'Sending…';

  try {
    const now = new Date().toISOString();
    await databaseService.addDocument('support_tickets', {
      userId:    user.uid,
      userName:  String(artisan.name || '').slice(0, 120),
      userEmail: String(artisan.email || user.email || '').slice(0, 254),
      role:      'artisan',
      subject,
      message,
      status:    TICKET_STATUS.OPEN,
      createdAt: now,
      updatedAt: now,
    });

    // Only now is "received" true. No time promise: none is backed by a process.
    await createNotification({
      receiverId: user.uid,
      senderId:   user.uid,
      type:       'System',
      title:      'Support request received',
      message:    `We have your request about "${topicLabel(subject)}". The reply will appear on the Support page and in your notifications.`,
    }).catch(() => {});

    showToast('Request sent. You will see the reply under "Your requests".', 'ok');
    document.getElementById('sp-subject').value = '';
    document.getElementById('sp-message').value = '';
  } catch (e) {
    errEl.textContent = 'Your request was not sent — check your connection and try again. Nothing was saved.';
  } finally {
    sending = false;
    btn.removeAttribute('aria-busy');
    btn.textContent = 'Send message';
  }
}
document.getElementById('sp-form').addEventListener('submit', (e) => { e.preventDefault(); submitTicket(); });

// ── Your requests ──────────────────────────────────────
// Read only by their owner and support staff (firestore.rules, support_tickets).
//
// Each request's row is built ONCE and then updated in place (SUP-001). The
// list used to be rebuilt with innerHTML on every snapshot — and every reply,
// from either side, updates the ticket — so the open conversation collapsed,
// came back empty, and stayed empty: its message listener was already
// registered, so reopening it never asked for the messages again. A support
// reply vanished the moment it arrived. Now the row, its open state, its
// thread, its listener and a half-typed reply all survive ticket snapshots.
// (sp-faq / sp-faq-q / sp-faq-a / .open are the rows' stable hooks.)
const ticketsEl     = document.getElementById('sp-tickets');
const ticketsState  = document.getElementById('sp-tickets-state');
const _rows         = new Map();   // ticketId → row element
const _threadUnsubs = new Map();   // ticketId → unsubscribe; one listener per ticket, ever
let _tickets = [];

function fmtWhen(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString('en-GH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function buildTicketRow(t) {
  const row = document.createElement('div');
  row.className = 'sp-faq fx-sup__ticket';
  row.id = `tk-${t.id}`;
  row.dataset.ticket = t.id;
  row.innerHTML = `
      <button class="sp-faq-q fx-sup__toggle" type="button" data-action="toggle" aria-expanded="false" aria-controls="tk-body-${esc(t.id)}">
        <span class="tk-head"></span>${icon('down')}
      </button>
      <div class="sp-faq-a fx-sup__body" id="tk-body-${esc(t.id)}">
        <div class="fx-sup__msg"><p class="fx-sup__who"><strong>You</strong> · ${esc(fmtWhen(t.createdAt))}</p>
        <p class="fx-sup__text">${esc(t.message)}</p></div>
        <div class="tk-thread fx-sup__thread"></div>
        <div class="tk-compose fx-sup__compose"></div>
      </div>`;
  return row;
}

/** Brings a row up to date without touching what the artisan is doing in it. */
function updateTicketRow(row, t) {
  row.querySelector('.tk-head').textContent = `${topicLabel(t.subject)} · ${ticketStatusLabel(t.status)}`;
  const closed = String(t.status === TICKET_STATUS.CLOSED);
  if (row.dataset.closed === closed) return;   // the reply box only changes when the request closes/reopens
  row.dataset.closed = closed;
  row.querySelector('.tk-compose').innerHTML = closed === 'true'
    ? '<p class="fx-sup__who">This request is closed. Send a new one if you still need help.</p>'
    : `<textarea class="fx-input" rows="3" aria-label="Your reply" placeholder="Add a reply…"></textarea>
       <button class="fx-btn fx-btn--secondary sp-submit" type="button" data-action="reply">Send reply</button>`;
}

function dropTicketRow(id) {
  _rows.get(id)?.remove();
  _rows.delete(id);
  const unsub = _threadUnsubs.get(id);
  if (unsub) { try { unsub(); } catch (_) {} }
  _threadUnsubs.delete(id);
}

function renderTickets() {
  const live = new Set();
  _tickets.forEach((t, i) => {
    live.add(t.id);
    let row = _rows.get(t.id);
    if (!row) { row = buildTicketRow(t); _rows.set(t.id, row); }
    updateTicketRow(row, t);
    // Move a row only when it is out of place: moving a node blurs the reply box.
    const at = ticketsEl.children[i + 1];   // child 0 is the state line
    if (at !== row) ticketsEl.insertBefore(row, at || null);
  });
  [..._rows.keys()].filter((id) => !live.has(id)).forEach(dropTicketRow);

  ticketsState.textContent = 'You have not sent any requests yet.';
  ticketsState.hidden = _tickets.length > 0;
}

function toggleTicket(id) {
  const row = _rows.get(id);
  if (!row) return;
  const body = row.querySelector('.sp-faq-a');
  const open = !body.classList.contains('open');
  body.classList.toggle('open', open);
  row.querySelector('.sp-faq-q').setAttribute('aria-expanded', String(open));
  if (open && !_threadUnsubs.has(id)) {
    const threadEl = row.querySelector('.tk-thread');   // lives as long as the row
    _threadUnsubs.set(id, databaseService.subscribeToSubCollection('support_tickets', id, 'messages', [], {},
      (msgs) => {
        const rows = (msgs || []).map((m) => ({ id: m.id, ...(m.data || {}) }))
          .sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
        threadEl.innerHTML = rows.map((m) => `
          <div class="fx-sup__msg"><p class="fx-sup__who"><strong>${m.authorRole === 'support' ? 'Fidus X support' : 'You'}</strong> · ${esc(fmtWhen(m.createdAt))}</p>
          <p class="fx-sup__text">${esc(m.body)}</p></div>`).join('');
      },
      () => {}));
  }
}

ticketsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  const row = btn?.closest('[data-ticket]');
  if (!row) return;
  if (btn.dataset.action === 'toggle') toggleTicket(row.dataset.ticket);
  else if (btn.dataset.action === 'reply') replyTicket(row.dataset.ticket, btn);
});

async function replyTicket(id, btn) {
  const ta = _rows.get(id)?.querySelector('.tk-compose textarea');
  if (!ta) return;
  const v = validateReply(ta.value);
  if (!v.ok) { showToast(v.error, 'warn'); return; }
  if (btn.getAttribute('aria-busy') === 'true') return;
  btn.setAttribute('aria-busy', 'true');
  try {
    const now = new Date().toISOString();
    await databaseService.addSubDocument('support_tickets', id, 'messages', {
      authorId: user.uid, authorRole: 'user', body: ta.value.trim(), createdAt: now,
    });
    await databaseService.updateDocument('support_tickets', id, {
      status: TICKET_STATUS.OPEN, lastReplyAt: now, lastReplyBy: 'user', updatedAt: now,
    });
    ta.value = '';
  } catch (e) {
    showToast('Your reply was not sent — check your connection and try again.', 'bad');
  } finally {
    btn.removeAttribute('aria-busy');
  }
}

// Cache first (CLAUDE.md §1, PERF-002): a return visit paints the last list of
// requests at once and the listener refreshes it silently. Only what a row
// shows is cached — topic, the artisan's own message, status and dates; never
// the ticket's userEmail, userName or userId. Threads are not cached: a
// conversation is read live when it is opened.
const cacheableTicket = (r) => {
  const d = r.data || {};
  return { id: r.id, subject: d.subject, message: d.message, status: d.status,
           createdAt: d.createdAt ?? null, updatedAt: d.updatedAt ?? null };
};
const _ticketsView = mountInstantView({
  key: 'artisan-support-requests',
  version: 1,
  render: (items) => {
    _tickets = (items || []).slice()
      .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    renderTickets();
  },
  subscribe: (_c, onData, onError) => databaseService.subscribeToCollection('support_tickets',
    [{ field: 'userId', op: '==', value: user.uid }], {},
    (records) => onData((records || []).map(cacheableTicket)), onError),
  // A failed refresh never blanks requests already on screen.
  onError: (_err, { hasContent }) => {
    if (hasContent) return;
    ticketsState.textContent = 'Could not load your requests. Check your connection.';
    ticketsState.hidden = false;
  },
});

window.addEventListener('pagehide', () => {
  try { _ticketsView.destroy(); } catch (_) {}
  _threadUnsubs.forEach((u) => { try { u(); } catch (_) {} });
  _threadUnsubs.clear();
});
</script>
<!-- The liveness heartbeat on every artisan page (it draws no bar here: the page has its own). -->
<script src="js/artisanFloatingNav.js"></script>
<script src="js/pwa.js" defer></script>
</body>
</html>
