<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="../shared/js/utils/themeManager.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#F97316" />
  <title>Support | Fidus X Artisan</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/ui-polish.css" />
  <style>
    .sp-shell  { max-width:430px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; background:var(--surface-2); }
    .sp-header { background:var(--surface); padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:10; }
    .sp-back  { width:36px; height:36px; border:none; background:var(--surface-3); border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
    .sp-title { font-size:17px; font-weight:800; color:var(--text-dark); flex:1; }
    .sp-body  { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px; }

    /* Hero */
    .sp-hero { background:linear-gradient(135deg, #F97316, #EA6C08); border-radius:var(--radius-lg); padding:24px 20px; margin-bottom:16px; color:#fff; text-align:center; }
    .sp-hero-icon { width:56px; height:56px; margin:0 auto 12px; border-radius:16px; background:var(--primary-light,#FFF7ED); color:var(--primary,#F97316); display:inline-flex; align-items:center; justify-content:center; }
    .sp-hero-icon svg { width:28px; height:28px; }
    .sp-hero-title { font-size:18px; font-weight:800; margin:0 0 6px; }
    .sp-hero-sub   { font-size:13px; opacity:.85; margin:0; line-height:1.5; }

    /* Contact cards */
    .sp-section-label { font-size:11px; font-weight:700; color:var(--text-light); text-transform:uppercase; letter-spacing:.7px; margin:0 0 10px; }
    .sp-contact-list { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
    .sp-contact-card { background:var(--surface); border-radius:var(--radius-md); padding:16px; display:flex; align-items:center; gap:14px; cursor:pointer; box-shadow:var(--shadow-sm); transition:transform .1s; text-decoration:none; }
    .sp-contact-card:active { transform:scale(0.98); }
    .sp-c-icon { width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .sp-c-info { flex:1; min-width:0; }
    .sp-c-title { font-size:14px; font-weight:700; color:var(--text-dark); margin:0 0 2px; }
    .sp-c-sub   { font-size:12px; color:var(--text-mid); margin:0; }
    .sp-c-arrow { color:var(--text-light); flex-shrink:0; }

    /* FAQ */
    .sp-faq-list { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
    .sp-faq { background:var(--surface); border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--shadow-sm); }
    .sp-faq-q { width:100%; display:flex; align-items:center; justify-content:space-between; padding:14px 16px; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--text-dark); background:none; border:none; cursor:pointer; text-align:left; gap:10px; }
    .sp-faq-q svg { flex-shrink:0; transition:transform .2s; }
    .sp-faq-q.open svg { transform:rotate(180deg); }
    .sp-faq-a { font-size:13px; color:var(--text-mid); line-height:1.6; padding:0 16px; max-height:0; overflow:hidden; transition:max-height .3s ease, padding .3s; }
    .sp-faq-a.open { max-height:300px; padding:0 16px 14px; }

    /* Ticket form */
    .sp-form { background:var(--surface); border-radius:var(--radius-md); padding:18px; box-shadow:var(--shadow-sm); margin-bottom:20px; }
    .sp-form-title { font-size:14px; font-weight:800; color:var(--text-dark); margin:0 0 14px; }
    .sp-field { margin-bottom:12px; }
    .sp-label { font-size:11.5px; font-weight:600; color:var(--text-mid); margin-bottom:5px; display:block; }
    .sp-select, .sp-input, .sp-textarea {
      width:100%; border:1.5px solid var(--border); border-radius:10px; padding:11px 13px;
      font-family:inherit; font-size:14px; color:var(--text-dark); background:var(--surface);
      outline:none; transition:border-color .15s;
    }
    .sp-select:focus, .sp-input:focus, .sp-textarea:focus { border-color:var(--primary); }
    .sp-textarea { min-height:100px; resize:vertical; }
    .sp-submit { width:100%; height:50px; background:var(--primary); color:#fff; border:none; border-radius:12px; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; transition:opacity .15s; }
    .sp-submit:disabled { opacity:.6; cursor:not-allowed; }

    /* Version note */
    .sp-version { text-align:center; font-size:11px; color:var(--text-light); padding:10px 0 24px; }
  </style>
</head>
<body>
<div class="sp-shell">

  <header class="sp-header">
    <button class="sp-back" aria-label="Go back" onclick="history.back()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M19 12H5M5 12l7 7M5 12l7-7" stroke="currentColor" stroke-width="2.0" stroke-linecap="round"/>
      </svg>
    </button>
    <span class="sp-title">Help & Support</span>
  </header>

  <div class="sp-body">

    <div class="sp-hero">
      <div class="sp-hero-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <p class="sp-hero-title">How can we help?</p>
      <p class="sp-hero-sub" id="sp-hero-sub">Send us a request below. The reply appears on this page and in your notifications.</p>
    </div>

    <!-- Contact channels — only those the owner has confirmed are staffed
         (shared/js/config/supportConfig.js). No placeholder numbers. -->
    <p class="sp-section-label" id="sp-contact-label" style="display:none">Contact Us</p>
    <div class="sp-contact-list" id="sp-contact-list"></div>

    <!-- FAQ -->
    <p class="sp-section-label">Frequently Asked Questions</p>
    <div class="sp-faq-list" id="faq-list">
      <!-- Rendered by JS -->
    </div>

    <!-- Support ticket -->
    <div class="sp-form">
      <p class="sp-form-title">Send a Message</p>

      <div class="sp-field">
        <label class="sp-label" for="sp-subject">Subject</label>
        <select class="sp-select" id="sp-subject">
          <option value="">Select a topic…</option>
          <option value="payment">Payment / Earnings issue</option>
          <option value="booking">Booking problem</option>
          <option value="kyc">KYC / Verification</option>
          <option value="account">Account issue</option>
          <option value="technical">App not working</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="sp-field">
        <label class="sp-label" for="sp-message">Your message</label>
        <textarea class="sp-textarea" id="sp-message" placeholder="Describe your issue in detail…"></textarea>
      </div>

      <p class="sp-label" id="sp-form-error" role="alert" style="display:none;color:var(--ds-danger)"></p>
      <button class="sp-submit" id="sp-submit-btn" onclick="submitTicket()">Send Message</button>
    </div>

    <!-- Your requests: status and the conversation with support -->
    <p class="sp-section-label">Your requests</p>
    <div class="sp-faq-list" id="sp-tickets">
      <p class="sp-label" id="sp-tickets-state">Loading your requests…</p>
    </div>

    <p class="sp-version" id="sp-version">Fidus X Artisan · v1.0</p>

  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import '../shared/js/utils/global-app.js';
import { getAppContainer }    from '../shared/js/app/container.js';
import { requireArtisanAuth } from './js/utils/artisanAuthGuard.js';
import { createNotification } from '../shared/js/services/notificationRepository.js';
import { SUPPORT_CONTACTS }   from '../shared/js/config/supportConfig.js';
import { PLATFORM_CONFIG }    from '../shared/js/config/appConfig.js';
import { TICKET_STATUS, validateTicket, validateReply, ticketStatusLabel, topicLabel }
                              from '../shared/js/domain/supportTickets.js';
import { mountInstantView }   from '../shared/js/services/instantView.js';

const { user, artisan } = await requireArtisanAuth({ allowPending: true });

// ── Help with a specific job ───────────────────────────
// job.html sends approved work here ("Get help with this job"): once a quote is
// approved the server refuses an artisan cancellation, and Support is the route
// out (Phase 0 WF-01). The booking reference is pre-filled so the team knows
// which job; it travels in the message text, the ticket's own fields unchanged.
{
  const ref = new URLSearchParams(location.search).get('bookingId') || '';
  if (/^[A-Za-z0-9_-]{4,64}$/.test(ref)) {
    const subject = document.getElementById('sp-subject');
    const message = document.getElementById('sp-message');
    if (subject && !subject.value) subject.value = 'booking';
    if (message && !message.value) message.value = `About booking ${ref}: `;
  }
}

// ── FAQ data ───────────────────────────────────────────
// Every answer states what the product does today. The figures come from
// PLATFORM_CONFIG, which tests/config-consistency.test.cjs pins to the values
// the server enforces (functions/config.js).
const COMMISSION_PCT = Math.round(PLATFORM_CONFIG.commissionRate * 100);
const MIN_WITHDRAWAL = PLATFORM_CONFIG.minWithdrawalGHS;
const FAQS = [
  {
    q: 'How do I get paid for completed jobs?',
    a: 'Earnings are held in escrow during the job. Once the customer confirms completion (or automatically after 7 days if there is no dispute), funds are released to your Fidus X wallet. You can withdraw anytime to MoMo, Telecel Cash, or AirtelTigo Money.'
  },
  {
    q: 'Why can\'t I go online?',
    a: 'You need to complete KYC verification before going online. Go to your dashboard and tap "Complete KYC" or visit the Onboarding page to submit your documents. An administrator reviews your documents and you get a notification when they have been reviewed.'
  },
  {
    q: 'What happens if I miss a job request?',
    a: 'If you don\'t respond to a job within the countdown timer, it will be reassigned to another artisan. Frequent missed requests may lower your response rate score, which affects how often you\'re dispatched jobs.'
  },
  {
    q: 'How is the platform fee calculated?',
    a: `Fidus X charges a ${COMMISSION_PCT}% commission on completed job earnings. It is deducted automatically before the funds reach your wallet, and each earning in your wallet shows the gross amount and the commission taken.`
  },
  {
    q: 'Can I cancel a booking I already accepted?',
    a: 'Yes. Tap the booking in your Bookings tab and use the Cancel option. The customer is relying on you, so please only cancel when absolutely necessary and contact them first.'
  },
  {
    q: 'How do I withdraw my earnings?',
    a: `Go to the Wallet tab, tap "Withdraw Earnings", enter the amount and your security PIN. The money goes to the payout account on your profile, and the wallet shows the withdrawal's status until it completes. Minimum withdrawal is GHS ${MIN_WITHDRAWAL}.`
  },
];

const faqList = document.getElementById('faq-list');
faqList.innerHTML = FAQS.map((f, i) => `
  <div class="sp-faq">
    <button class="sp-faq-q" id="faq-q-${i}" onclick="toggleFaq(${i})">
      ${f.q}
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="sp-faq-a" id="faq-a-${i}">${f.a}</div>
  </div>`).join('');

window.toggleFaq = function(i) {
  const q = document.getElementById(`faq-q-${i}`);
  const a = document.getElementById(`faq-a-${i}`);
  const isOpen = a.classList.contains('open');
  // Close all
  document.querySelectorAll('.sp-faq-q').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.sp-faq-a').forEach(el => el.classList.remove('open'));
  if (!isOpen) { q.classList.add('open'); a.classList.add('open'); }
};

// ── Contact channels (only confirmed ones) ─────────────
// shared/js/config/supportConfig.js is empty until the owner confirms which
// channels are staffed; nothing is shown that nobody answers.
(function renderContacts() {
  const list = document.getElementById('sp-contact-list');
  const cards = [];
  const card = (href, title, sub, ext) => `
    <a class="sp-contact-card" href="${esc(href)}"${ext ? ' target="_blank" rel="noopener"' : ''}>
      <div class="sp-c-info"><p class="sp-c-title">${esc(title)}</p><p class="sp-c-sub">${esc(sub)}</p></div>
    </a>`;
  if (SUPPORT_CONTACTS.email)    cards.push(card(`mailto:${SUPPORT_CONTACTS.email}`, 'Email Support', SUPPORT_CONTACTS.email));
  if (SUPPORT_CONTACTS.whatsapp) cards.push(card(`https://wa.me/${SUPPORT_CONTACTS.whatsapp}`, 'WhatsApp', 'Chat with us', true));
  if (SUPPORT_CONTACTS.phone)    cards.push(card(`tel:${SUPPORT_CONTACTS.phone}`, 'Call Us', SUPPORT_CONTACTS.phone));
  if (cards.length) {
    list.innerHTML = cards.join('');
    document.getElementById('sp-contact-label').style.display = '';
  }
  if (SUPPORT_CONTACTS.hours) {
    document.getElementById('sp-hero-sub').textContent += ` Support hours: ${SUPPORT_CONTACTS.hours}.`;
  }
})();

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

const { services: { databaseService } } = getAppContainer();

// ── Submit a request ───────────────────────────────────
// The ticket is written FIRST. The acknowledgement used to be sent before it,
// so a failed write still told the artisan their message had been received,
// and it promised a reply "within 2 hours" that no process stood behind.
window.submitTicket = async function() {
  const subject = document.getElementById('sp-subject').value;
  const message = document.getElementById('sp-message').value.trim();
  const errEl   = document.getElementById('sp-form-error');
  errEl.style.display = 'none';

  const v = validateTicket({ subject, message });
  if (!v.ok) { errEl.textContent = v.error; errEl.style.display = ''; return; }

  const btn = document.getElementById('sp-submit-btn');
  btn.disabled = true;
  btn.textContent = 'Sending…';

  try {
    const now = new Date().toISOString();
    await databaseService.addDocument('support_tickets', {
      userId:    user.uid,
      userName:  String(artisan.name || '').slice(0, 120),
      userEmail: String(artisan.email || user.email || '').slice(0, 254),
      role:      'artisan',
      subject,
      message,
      status:    TICKET_STATUS.OPEN,
      createdAt: now,
      updatedAt: now,
    });

    // Only now is "received" true. No time promise: none is backed by a process.
    await createNotification({
      receiverId: user.uid,
      senderId:   user.uid,
      type:       'System',
      title:      'Support request received',
      message:    `We have your request about "${topicLabel(subject)}". The reply will appear on the Support page and in your notifications.`,
    }).catch(() => {});

    showToast('Request sent. You will see the reply under "Your requests".');
    document.getElementById('sp-subject').value = '';
    document.getElementById('sp-message').value = '';
  } catch (e) {
    errEl.textContent = 'Your request was not sent — check your connection and try again. Nothing was saved.';
    errEl.style.display = '';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send Message';
  }
};

// ── Your requests ──────────────────────────────────────
// Read only by their owner and support staff (firestore.rules, support_tickets).
//
// Each request's row is built ONCE and then updated in place (SUP-001). The
// list used to be rebuilt with innerHTML on every snapshot — and every reply,
// from either side, updates the ticket — so the open conversation collapsed,
// came back empty, and stayed empty: its message listener was already
// registered, so reopening it never asked for the messages again. A support
// reply vanished the moment it arrived. Now the row, its open state, its
// thread, its listener and a half-typed reply all survive ticket snapshots.
const ticketsEl     = document.getElementById('sp-tickets');
const ticketsState  = document.getElementById('sp-tickets-state');
const _rows         = new Map();   // ticketId → row element
const _threadUnsubs = new Map();   // ticketId → unsubscribe; one listener per ticket, ever
let _tickets = [];

function fmtWhen(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString('en-GH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function buildTicketRow(t) {
  const row = document.createElement('div');
  row.className = 'sp-faq';
  row.id = `tk-${t.id}`;
  row.dataset.ticket = t.id;
  row.innerHTML = `
      <button class="sp-faq-q" data-action="toggle">
        <span class="tk-head"></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="sp-faq-a">
        <p style="margin:0 0 6px;"><strong>You</strong> · ${esc(fmtWhen(t.createdAt))}</p>
        <p style="margin:0 0 10px;white-space:pre-wrap;">${esc(t.message)}</p>
        <div class="tk-thread"></div>
        <div class="tk-compose"></div>
      </div>`;
  return row;
}

/** Brings a row up to date without touching what the artisan is doing in it. */
function updateTicketRow(row, t) {
  row.querySelector('.tk-head').textContent = `${topicLabel(t.subject)} · ${ticketStatusLabel(t.status)}`;
  const closed = String(t.status === TICKET_STATUS.CLOSED);
  if (row.dataset.closed === closed) return;   // the reply box only changes when the request closes/reopens
  row.dataset.closed = closed;
  row.querySelector('.tk-compose').innerHTML = closed === 'true'
    ? '<p class="sp-label">This request is closed. Send a new one if you still need help.</p>'
    : `<textarea class="sp-textarea" placeholder="Add a reply…"></textarea>
       <button class="sp-submit" data-action="reply">Send reply</button>`;
}

function dropTicketRow(id) {
  _rows.get(id)?.remove();
  _rows.delete(id);
  const unsub = _threadUnsubs.get(id);
  if (unsub) { try { unsub(); } catch (_) {} }
  _threadUnsubs.delete(id);
}

function renderTickets() {
  const live = new Set();
  _tickets.forEach((t, i) => {
    live.add(t.id);
    let row = _rows.get(t.id);
    if (!row) { row = buildTicketRow(t); _rows.set(t.id, row); }
    updateTicketRow(row, t);
    // Move a row only when it is out of place: moving a node blurs the reply box.
    const at = ticketsEl.children[i + 1];   // child 0 is the state line
    if (at !== row) ticketsEl.insertBefore(row, at || null);
  });
  [..._rows.keys()].filter((id) => !live.has(id)).forEach(dropTicketRow);

  ticketsState.textContent = 'You have not sent any requests yet.';
  ticketsState.style.display = _tickets.length ? 'none' : '';
}

function toggleTicket(id) {
  const row = _rows.get(id);
  if (!row) return;
  const body = row.querySelector('.sp-faq-a');
  const open = !body.classList.contains('open');
  body.classList.toggle('open', open);
  if (open && !_threadUnsubs.has(id)) {
    const threadEl = row.querySelector('.tk-thread');   // lives as long as the row
    _threadUnsubs.set(id, databaseService.subscribeToSubCollection('support_tickets', id, 'messages', [], {},
      (msgs) => {
        const rows = (msgs || []).map((m) => ({ id: m.id, ...(m.data || {}) }))
          .sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
        threadEl.innerHTML = rows.map((m) => `
          <p style="margin:8px 0 4px;"><strong>${m.authorRole === 'support' ? 'Fidus X support' : 'You'}</strong> · ${esc(fmtWhen(m.createdAt))}</p>
          <p style="margin:0;white-space:pre-wrap;">${esc(m.body)}</p>`).join('');
      },
      () => {}));
  }
}

ticketsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  const row = btn?.closest('[data-ticket]');
  if (!row) return;
  if (btn.dataset.action === 'toggle') toggleTicket(row.dataset.ticket);
  else if (btn.dataset.action === 'reply') replyTicket(row.dataset.ticket, btn);
});

async function replyTicket(id, btn) {
  const ta = _rows.get(id)?.querySelector('.tk-compose textarea');
  if (!ta) return;
  const v = validateReply(ta.value);
  if (!v.ok) { showToast(v.error); return; }
  btn.disabled = true;
  try {
    const now = new Date().toISOString();
    await databaseService.addSubDocument('support_tickets', id, 'messages', {
      authorId: user.uid, authorRole: 'user', body: ta.value.trim(), createdAt: now,
    });
    await databaseService.updateDocument('support_tickets', id, {
      status: TICKET_STATUS.OPEN, lastReplyAt: now, lastReplyBy: 'user', updatedAt: now,
    });
    ta.value = '';
  } catch (e) {
    showToast('Your reply was not sent — check your connection and try again.');
  } finally {
    btn.disabled = false;
  }
}

// Cache first (CLAUDE.md §1, PERF-002): a return visit paints the last list of
// requests at once and the listener refreshes it silently. Only what a row
// shows is cached — topic, the artisan's own message, status and dates; never
// the ticket's userEmail, userName or userId. Threads are not cached: a
// conversation is read live when it is opened.
const cacheableTicket = (r) => {
  const d = r.data || {};
  return { id: r.id, subject: d.subject, message: d.message, status: d.status,
           createdAt: d.createdAt ?? null, updatedAt: d.updatedAt ?? null };
};
const _ticketsView = mountInstantView({
  key: 'artisan-support-requests',
  version: 1,
  render: (items) => {
    _tickets = (items || []).slice()
      .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    renderTickets();
  },
  subscribe: (_c, onData, onError) => databaseService.subscribeToCollection('support_tickets',
    [{ field: 'userId', op: '==', value: user.uid }], {},
    (records) => onData((records || []).map(cacheableTicket)), onError),
  // A failed refresh never blanks requests already on screen.
  onError: (_err, { hasContent }) => {
    if (hasContent) return;
    ticketsState.textContent = 'Could not load your requests. Check your connection.';
    ticketsState.style.display = '';
  },
});

window.addEventListener('pagehide', () => {
  try { _ticketsView.destroy(); } catch (_) {}
  _threadUnsubs.forEach((u) => { try { u(); } catch (_) {} });
  _threadUnsubs.clear();
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2400);
}
</script>
<script src="js/artisanFloatingNav.js"></script>
<script src="js/pwa.js" defer></script>
</body>
</html>
