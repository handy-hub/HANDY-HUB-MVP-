<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandyHub Artisan</title>
  <style>
    body { margin: 0; font-family: 'DM Sans', sans-serif; background: #F5F6FA;
           display: flex; align-items: center; justify-content: center; min-height: 100dvh; }
    .spin { width: 36px; height: 36px; border: 3px solid #f0f0f0; border-top-color: #F97316;
            border-radius: 50%; animation: s .7s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spin"></div>

  <script src="../shared/js/utils/global-app.js"></script>
  <script type="module">
    import { getAppContainer } from '../shared/js/app/container.js';

    // The routing logic lives inside an async IIFE rather than at module top
    // level. Top-level `return` is valid ES-module syntax, but wrapping it in a
    // function makes the entry point robust if this file is ever loaded/served
    // as a classic script (some static dev servers strip type="module"), where a
    // top-level `return` is a fatal "Illegal return statement" that hangs the
    // spinner forever. A function body's `return` is always legal.
    (async () => {
      const { services: { authService, databaseService } } = getAppContainer();

      // Smart entry-point: check auth state and route appropriately.
      //   logged-in valid artisan   → dashboard
      //   logged-in non-artisan     → login
      //   not logged in / any error → login
      try {
        const user = await Promise.race([
          authService.waitForUser(),
          new Promise(r => setTimeout(() => r(null), 4000)),
        ]);

        if (!user) {
          window.location.replace('login.html');
          return;
        }

        const snap = await databaseService.getDocument('artisans', user.uid).catch(() => null);

        if (!snap || !snap.exists || snap.data?.userType !== 'artisan') {
          window.location.replace('login.html');
          return;
        }

        const status = (snap.data.status || '').toLowerCase();
        if (status === 'suspended' || status === 'banned') {
          // The destination page's guard shows the suspended screen.
          window.location.replace('dashboard.html');
          return;
        }

        window.location.replace('dashboard.html');
      } catch (_) {
        window.location.replace('login.html');
      }
    })();
  </script>
</body>
</html>
