<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#F97316" />
  <title>Fidus X for professionals</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/fx/entry.css" />
</head>
<body class="fx-app">
<!-- The app's front door: sends a visitor to the screen their account needs.
     Where a signed-in artisan goes is the server's record (js/entry.js
     routeExisting); a profile that cannot be read is an outage, not a missing
     account — Today's guard shows the retry (FLOW-004). -->
<main class="fx-entry" aria-busy="true">
  <div class="fx-entry__col">
    <p class="fx-wordmark"><span class="fx-wordmark__name">Fidus X</span> <span class="fx-wordmark__for">for professionals</span></p>
    <p class="fx-meta" role="status">Opening Fidus X…</p>
  </div>
</main>
<script src="../shared/js/utils/global-app.js"></script>
<script type="module">
  import { getAppContainer } from '../shared/js/app/container.js';
  import { routeExisting }   from './js/entry.js';
  (async () => {
    try {
      const dev = await import('../shared/js/config/devAccess.js');
      if (dev.isArtisanDevAccessEnabled()) { window.location.replace('dashboard.html'); return; }
    } catch (_) { /* dev module missing → real routing below */ }
    const { services: { authService, databaseService } } = getAppContainer();
    const user = await Promise.race([
      authService.waitForUser().catch(() => null),
      new Promise((r) => setTimeout(() => r(null), 4000)),
    ]);
    if (!user) { window.location.replace('login.html'); return; }
    const snap = await databaseService.getDocument('artisans', user.uid).catch(() => undefined);
    if (snap === undefined) { window.location.replace('dashboard.html'); return; }       // unreachable: Today's guard retries
    if (!snap || !snap.exists || snap.data?.userType !== 'artisan') { window.location.replace('login.html'); return; }   // login routes every account type
    window.location.replace(routeExisting(snap.data).go);
  })();
</script>
<script src="js/pwa.js" defer></script>
</body>
</html>
