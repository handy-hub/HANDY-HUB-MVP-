<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#F97316" />
<title>My Bookings | Fidus X Artisan</title>
<!--
  RETIRED — this screen was the artisan app's THIRD booking surface.

  It listed the same bookings as jobs.html (which already separates them into
  Pending / Active / Completed / Cancelled tabs) and carried its own third copy
  of the lifecycle transitions. Its "View" button linked to `jobs.html?id=...`,
  a parameter jobs.html never read — so tapping one booking opened an
  unfiltered list of all of them.

  The list lives in jobs.html. A single booking lives in job.html?id=<ID>.
  This file stays only so existing links, bookmarks and notifications resolve.
-->
<script>
  // Preserve a booking id if one was passed, so an old deep link still lands
  // on the booking it named rather than dumping the artisan in a list.
  (function () {
    var id = new URLSearchParams(location.search).get('id');
    location.replace(id ? 'job.html?id=' + encodeURIComponent(id) : 'jobs.html');
  })();
</script>
</head>
<body><script src="js/pwa.js" defer></script>
</body>
</html>
