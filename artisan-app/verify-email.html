<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#F97316" />
  <title>Check your email | Fidus X for professionals</title>
  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/fx/entry.css" />
</head>
<body class="fx-app">
<!-- The emailed-code step of sign-up. Reached only when signup.html's
     REQUIRE_EMAIL_OTP is on (it is off until a sending domain is verified);
     driven by the shared controller (shared/js/ui/otpVerifyController.js),
     which needs the otp-* ids below. -->
<a class="fx-skip" href="#entry-main">Skip to content</a>
<main class="fx-entry" id="entry-main" tabindex="-1">
  <div class="fx-entry__col">

    <div class="fx-entry__top">
      <p class="fx-wordmark"><span class="fx-wordmark__name">Fidus X</span> <span class="fx-wordmark__for">for professionals</span></p>
      <a class="fx-iconbtn" href="signup.html" id="otp-restart-link" aria-label="Back to sign-up"><span data-icon="back"></span></a>
    </div>

    <div class="fx-entry__head">
      <h1 class="fx-title">Check your email</h1>
      <p class="fx-lead">We sent a 6-digit code to <strong id="otp-email-display">your email address</strong>. It expires in 5 minutes.</p>
    </div>

    <div class="fx-entry__form">
      <div class="fx-field">
        <p class="fx-field__label" id="otp-label">Verification code</p>
        <div class="fx-entry__code" role="group" aria-labelledby="otp-label">
          <input class="fx-input" type="tel" inputmode="numeric" maxlength="1" data-otp-input="1" autocomplete="one-time-code" aria-label="Digit 1" />
          <input class="fx-input" type="tel" inputmode="numeric" maxlength="1" data-otp-input="2" autocomplete="off" aria-label="Digit 2" />
          <input class="fx-input" type="tel" inputmode="numeric" maxlength="1" data-otp-input="3" autocomplete="off" aria-label="Digit 3" />
          <input class="fx-input" type="tel" inputmode="numeric" maxlength="1" data-otp-input="4" autocomplete="off" aria-label="Digit 4" />
          <input class="fx-input" type="tel" inputmode="numeric" maxlength="1" data-otp-input="5" autocomplete="off" aria-label="Digit 5" />
          <input class="fx-input" type="tel" inputmode="numeric" maxlength="1" data-otp-input="6" autocomplete="off" aria-label="Digit 6" />
        </div>
        <p class="fx-field__error" id="otp-error" role="alert" hidden></p>
      </div>
      <button class="fx-btn fx-btn--primary fx-btn--l fx-btn--block" id="otp-submit-btn" type="button">
        <span class="fx-spin" id="otp-loading" aria-hidden="true" hidden></span>
        Verify and create account
      </button>
      <div class="fx-entry__row" aria-live="polite">
        <p class="fx-meta" id="otp-countdown-wrap">You can ask for a new code in <span class="fx-num" id="otp-countdown">60</span> s.</p>
        <button class="fx-btn fx-btn--tertiary fx-btn--s" id="otp-resend-btn" type="button" disabled>Send a new code</button>
      </div>
    </div>

    <p class="fx-entry__alt">Wrong email? <a class="fx-link" href="signup.html" id="otp-restart-link-2">Go back and change it</a></p>
  </div>
</main>

<script type="module">
  import { icon } from './js/fx/icons.js';
  import { bootstrapOtpVerifyPage } from '../shared/js/ui/otpVerifyController.js';
  for (const el of document.querySelectorAll('[data-icon]')) el.outerHTML = icon(el.dataset.icon);
  bootstrapOtpVerifyPage({
    appType:         'artisan',
    successRedirect: 'onboarding.html',   // signed in via custom token → complete the application
    loginRedirect:   'login.html',        // if the sign-in here could not complete
    restartRedirect: 'signup.html',
  });
</script>
<script src="js/pwa.js" defer></script>
</body>
</html>
