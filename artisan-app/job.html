<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#F97316" />
<title>Job | Fidus X for professionals</title>
<script src="../shared/js/utils/themeManager.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The variable axes: fixed weights would snap 550 and 650 to the nearest file. -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/fx/job.css">
</head>
<body class="fx-app">
<a class="fx-skip" href="#jb-main">Skip to content</a>
<div class="fx-shell">
  <!-- This screen is ONE booking, from request to closed. Everything is
       phase-driven (artisan-app/js/jobScreen.js): the same screen redraws as the
       booking moves, so the artisan never loses their place. -->
  <header class="fx-appbar fx-appbar--push">
    <a class="fx-iconbtn" href="jobs.html" id="jb-back" aria-label="Back to jobs"><span data-icon="back"></span></a>
    <div class="fx-appbar__titles">
      <p class="fx-appbar__title">Job</p>
      <p class="fx-appbar__sub fx-num" id="jb-ref"></p>
    </div>
  </header>

  <main class="fx-main" id="jb-main" tabindex="-1">
    <div id="jb-body">
      <section class="fx-job__head fx-stack--4" aria-busy="true">
        <span class="fx-skel fx-skel--title"></span><span class="fx-skel fx-skel--row"></span><span class="fx-skel fx-skel--row"></span>
      </section>
    </div>
  </main>

  <div class="fx-bottom">
    <div class="fx-dock" id="jb-dock" hidden></div>
  </div>
</div>

<!-- Confirmations: the app's own sheet, never the browser's native dialog (audit UI-011). -->
<div class="fx-overlay" id="confirm-sheet" hidden>
  <button type="button" class="fx-scrim" tabindex="-1" aria-label="Close"></button>
  <section class="fx-sheet" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body" tabindex="-1">
    <header class="fx-sheet__head"><h2 class="fx-sheet__title" id="confirm-title"></h2></header>
    <div class="fx-sheet__body fx-stack"><p class="fx-body" id="confirm-body"></p><ul class="fx-job__terms" id="confirm-list" hidden></ul></div>
    <footer class="fx-sheet__actions">
      <button class="fx-btn fx-btn--secondary fx-btn--l" type="button" data-sheet-close data-autofocus>Go back</button>
      <button class="fx-btn fx-btn--l" type="button" data-confirm></button>
    </footer>
  </section>
</div>

<script type="module">
import { icon }             from './js/fx/icons.js';
import { openSheet }        from './js/fx/sheet.js';
import { showToast }        from './js/fx/toast.js';
import { jobPlan, renderJob, renderMessage, paintCountdown } from './js/jobScreen.js';
import { requireArtisanAuth } from './js/utils/artisanAuthGuard.js';
import { getAppContainer }  from '../shared/js/app/container.js';
import { resolveJobBrief }  from '../shared/js/domain/bookingTruth.js';
import { performBookingAction, ACTION, cancellationTerms }
                            from '../shared/js/domain/bookingActions.js';
import { pricingService }   from '../shared/js/services/pricingService.js';
import { mountQuoteComposer, quoteComposerStyles }
                            from '../shared/js/ui/quoteComposer.js';
import { offerState }       from '../shared/js/domain/jobOffers.js';

const $ = (id) => document.getElementById(id);
for (const el of document.querySelectorAll('[data-icon]')) el.outerHTML = icon(el.dataset.icon);

// ── Booking identity comes from the URL and nowhere else ─────────────────────
// artisan-app/bookings.html linked to `jobs.html?id=…` for months and jobs.html
// never read the parameter, so tapping a specific job opened an unfiltered
// list. This screen exists to make that impossible: no id, no screen.
const BOOKING_ID = new URLSearchParams(location.search).get('id');

const dom = { body: $('jb-body'), dock: $('jb-dock'), sub: $('jb-ref') };
let _uid = null, _booking = null, _busy = null, _unsub = null, _originLat = null, _originLng = null;
let _escrow = null, _escrowId = null, _escrowUnsub = null;   // see watchEscrow()
// The server refused an answer to this offer as gone (performBookingAction
// offerGone): from then on the request is drawn lapsed, whatever the listener says.
let _offerGone = false;
let _message = false;   // a whole-screen message is showing; snapshots do not redraw over it

function showMessage(title, body, cta) {
  _message = true;
  tickOffer(null);
  renderMessage(dom, title, body, cta);
}

/* ── Render ──────────────────────────────────────────────────────────────── */
function render(b) {
  if (!b) return;
  _booking = b;
  _message = false;
  const plan = jobPlan(b, { offerGone: _offerGone });
  // The quote form survives a redraw: a snapshot arriving while the artisan
  // types (callout paid, escrow loaded) must not wipe what they entered.
  const keep = plan.mountQuote ? $('jb-quote-mount') : null;
  if (keep) keep.remove();
  const hadFocus = dom.body.contains(document.activeElement) || dom.dock.contains(document.activeElement);
  renderJob(dom, b, plan, {
    nowMs: Date.now(), bookingId: BOOKING_ID, busy: _busy, originLat: _originLat, originLng: _originLng,
    escrow: b.escrowId && b.escrowId === _escrowId ? _escrow : null,
  });
  if (plan.mountQuote) {
    const slot = $('jb-quote-mount');
    if (slot && keep) slot.replaceWith(keep);
    else if (slot) mountComposer(slot, b);
  }
  if (hadFocus && (!document.activeElement || document.activeElement === document.body)) $('jb-title')?.focus({ preventScroll: true });
  tickOffer(plan.kind === 'offer' && !plan.lapsed && plan.offer.countdown ? b : null);
}

function mountComposer(host, b) {
  try {
    mountQuoteComposer({
      bookingId: BOOKING_ID,              // this screen's booking, explicitly
      mount: host,
      serviceLabel: resolveJobBrief(b).service,
      toast: (m) => showToast(m),
      onSubmitted: () => {
        // The live subscription redraws this screen from the new authoritative
        // state; no local guess about what comes next.
        showToast('Quote sent. Waiting for the customer to approve.', { tone: 'ok' });
      },
    });
  } catch (e) {
    host.innerHTML = '<p class="fx-meta">The quote form could not be opened. Reload and try again.</p>';
  }
}

/* ── Offer countdown ───────────────────────────────────────────────────────────
   Derived from the offer's expiresAtMs every second, never from a timer started
   on page load, so a refresh or a screen left open shows the true time left.
   At zero the screen redraws into its expired state. */
let _offerTick = null;
function tickOffer(offer) {
  clearInterval(_offerTick); _offerTick = null;
  if (!offer) return;
  _offerTick = setInterval(() => {
    const ranOut = paintCountdown(dom.body, Date.now());
    if (ranOut || offerState(offer).expired) { clearInterval(_offerTick); _offerTick = null; if (!_busy) render(offer); }
  }, 1000);
}

/* ── Act ─────────────────────────────────────────────────────────────────── */
// Each control jobScreen.js draws names one of these (data-act).
const RUN = {
  'accept':   { action: ACTION.ACCEPT,   ok: 'Job accepted. The customer has been notified.' },
  'decline':  { action: ACTION.DECLINE,
                confirm: { title: 'Decline this request?', body: 'It goes to another professional nearby.', label: 'Decline', danger: true } },
  'en-route': { action: ACTION.EN_ROUTE, ok: 'Marked as en route. Customer notified.' },
  'arrived':  { action: ACTION.START,    ok: 'Marked arrived. Customer notified.' },
  'complete-inspection': { inspection: true, ok: 'Inspection complete. Send your quote next.' },
  'job-done': { action: ACTION.JOB_DONE, ok: 'Marked done. Waiting for the customer to confirm.' },
  // Offered only where artisanCanCancel says the server accepts it.
  // What it does is listed before the artisan confirms: the server's own
  // consequences for THIS booking (bookingActions.cancellationTerms).
  'cancel':   { action: ACTION.CANCEL,   ok: 'Job cancelled. The customer has been told.',
                confirm: (b) => ({ title: 'Cancel this job?', body: 'This cannot be undone.',
                                   list: cancellationTerms(b).consequences || [], label: 'Cancel job', danger: true }) },
  // Approved work, travel or a dispute: Support, with this booking's reference.
  'help':     { href: () => `support.html?bookingId=${encodeURIComponent(BOOKING_ID)}` },
  'earnings': { href: () => 'wallet.html' },
};

function confirmIn({ title, body, label, danger, list = [] }) {
  return new Promise((resolve) => {
    const overlay = $('confirm-sheet');
    $('confirm-title').textContent = title;
    $('confirm-body').textContent = body;
    const ul = $('confirm-list');
    ul.textContent = '';
    for (const line of list) { const li = document.createElement('li'); li.textContent = line; ul.appendChild(li); }
    ul.hidden = !list.length;
    const btn = overlay.querySelector('[data-confirm]');
    btn.textContent = label;
    btn.className = `fx-btn fx-btn--l ${danger ? 'fx-btn--danger' : 'fx-btn--primary'}`;
    let yes = false;
    const onYes = () => { yes = true; sheet.close('confirm'); };
    const sheet = openSheet(overlay, { onClose: () => { btn.removeEventListener('click', onYes); resolve(yes); } });
    btn.addEventListener('click', onYes);
  });
}

async function run(spec) {
  if (_busy) return;                       // duplicate taps do nothing
  if (spec.href) { location.href = spec.href(); return; }
  const ask = typeof spec.confirm === 'function' ? spec.confirm(_booking) : spec.confirm;
  if (ask && !(await confirmIn(ask))) return;

  _busy = spec.action === ACTION.ACCEPT ? 'accept' : spec.action === ACTION.DECLINE ? 'decline' : 'step';
  render(_booking);
  let redraw = true;
  try {
    if (spec.inspection) {
      await pricingService.completeInspection(BOOKING_ID);
      showToast(spec.ok, { tone: 'ok' });
      return;
    }
    const { services: { databaseService } } = getAppContainer();
    const res = await performBookingAction(spec.action, {
      bookingId: BOOKING_ID, actor: 'artisan', uid: _uid,
      databaseService, pricingService, reason: 'Cancelled by artisan',
    });
    if (!res.ok) {
      // A booking that moved under us is explained with the state it is
      // ACTUALLY in — never "try again" at someone whose job was taken.
      showToast(res.message, { tone: 'bad' });
      if (res.offerGone) {
        // Expired, closed or re-offered: the request is retired on this
        // screen and its answers are not given back (FLOW-005).
        _offerGone = true;
        tickOffer(null);
        return;
      }
      if (res.booking) _booking = { id: BOOKING_ID, ...res.booking };
      return;
    }
    if (spec.action === ACTION.DECLINE) {
      // Declining closes the offer to this artisan: there is nothing left to show.
      try { _offerUnsub?.(); } catch (_) {}
      _offerUnsub = null;
      redraw = false;
      showMessage('Request declined', 'It has been offered to another professional, or the customer has been told.');
      return;
    }
    if (spec.action === ACTION.ACCEPT) {
      // Accepting is what opens the booking to this artisan: follow it now.
      // The offer stays drawn as "Accepting…" until the booking's first snapshot
      // replaces it, so there is no moment with a live Accept to tap twice.
      try { _offerUnsub?.(); } catch (_) {}
      _offerUnsub = null;
      redraw = false;
      watchBooking();
    }
    if (res.booking) _booking = { id: BOOKING_ID, ...res.booking };
    showToast(spec.ok, { tone: 'ok' });
  } catch (e) {
    showToast(e?.message || 'That did not go through. Nothing was changed.', { tone: 'bad' });
  } finally {
    _busy = null;
    // Redrawn from the authoritative state: a lapsed offer stays lapsed (_offerGone).
    if (redraw && !_message) render(_booking);
  }
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled || !RUN[el.dataset.act]) return;
  run(RUN[el.dataset.act]);
});

// One stylesheet for the composer, injected once.
(() => {
  const st = document.createElement('style');
  st.textContent = quoteComposerStyles();
  document.head.appendChild(st);
})();

/* ── Boot ────────────────────────────────────────────────────────────────── */
(async () => {
  if (!BOOKING_ID) {
    showMessage('No job selected', 'Open a job from your jobs list to see it here.');
    return;
  }

  // requireArtisanAuth — not the customer guard. It sends a real artisan to the
  // ARTISAN login and, locally, honours the dev-access session (unless the
  // emulators are in use, where a real sign-in is available and better).
  // It resolves to { artisan, ... }, NOT a Firebase user.
  const { artisan } = await requireArtisanAuth({ allowPending: true });
  _uid = artisan?.uid || artisan?.id || null;
  if (!_uid) return;   // the guard has already redirected

  const { services: { databaseService } } = getAppContainer();

  // The artisan's own position, for the distance line. Absent is fine — the
  // distance is simply omitted rather than shown as 0 km.
  try {
    // The artisan's own precise fix is in their private record; the public
    // profile carries ~1 km (shared/js/domain/locationPrivacy.js).
    const loc = await databaseService.getDocument(`artisans/${_uid}/private`, 'location').catch(() => null);
    const me = (loc && loc.exists) ? loc : await databaseService.getDocument('artisans', _uid);
    if (me?.exists) {
      const lat = Number(me.data.lat), lng = Number(me.data.lng);
      if (Number.isFinite(lat) && Number.isFinite(lng) && !(lat === 0 && lng === 0)) {
        _originLat = lat; _originLng = lng;
      }
    }
  } catch (_) { /* distance is optional */ }

  // Live authoritative state. The screen follows the booking rather than a
  // snapshot taken when the card was drawn — so a customer cancelling, or a
  // callout fee landing, updates this screen while the artisan is looking at it.
  watchBooking();
})();

// ── What this artisan may see of the job ─────────────────────────────────────
// A job they have TAKEN: the booking itself (they are its artisanId). A job they
// have only been OFFERED: firestore.rules refuse the booking, and the offer
// summary (job_offers/{id} — no address, position, notes or phone) is shown
// instead, for as long as the offer is open (functions/jobOffers.js).
let _offerUnsub = null, _phone = null, _phoneTried = false, _lastBooking = null;

function withPhone(b) { return _phone ? { ...b, customerPhone: _phone } : b; }

// The customer's phone: bookings/{id}/private/contact, which the rules open only
// once the job is committed and funded, and close when it ends.
async function loadPhone(b) {
  if (_phoneTried || !resolveJobBrief(b).customer.contactUnlocked) return;
  _phoneTried = true;
  const { services: { databaseService } } = getAppContainer();
  try {
    const snap = await databaseService.getDocument(`bookings/${BOOKING_ID}/private`, 'contact');
    if (snap?.exists && snap.data?.customerPhone) {
      _phone = snap.data.customerPhone;
      if (!_busy && _lastBooking) render(withPhone(_lastBooking));
    }
  } catch (_) { /* not disclosed in this state */ }
}

// The job escrow's outcome (held / released / refunded) lives on escrow/{id},
// which the rules let this artisan read. The money note follows it (FIN-002);
// without it the note claims nothing about where the money went.
function watchEscrow(b) {
  const id = b && b.escrowId;
  if (!id || id === _escrowId) return;
  _escrowId = id;
  _escrow = null;
  try { _escrowUnsub?.(); } catch (_) {}
  const { services: { databaseService } } = getAppContainer();
  _escrowUnsub = databaseService.subscribeToDocument('escrow', id, (snap) => {
    _escrow = snap?.exists ? snap.data : null;
    if (!_busy && _lastBooking) render(withPhone(_lastBooking));
  }, () => { _escrow = null; });
}

function watchOffer() {
  if (_offerUnsub) return;
  const { services: { databaseService } } = getAppContainer();
  _offerUnsub = databaseService.subscribeToDocument('job_offers', BOOKING_ID,
    (snap) => {
      if (!snap?.exists) { showMessage('Job not found', 'This request is no longer available, or it is not yours.'); return; }
      if (!_busy) render({ id: BOOKING_ID, ...snap.data });
    },
    () => showMessage('Request no longer open', 'It was accepted, declined, expired or withdrawn.')
  );
}

function watchBooking() {
  const { services: { databaseService } } = getAppContainer();
  try { _unsub?.(); } catch (_) {}
  _unsub = databaseService.subscribeToDocument('bookings', BOOKING_ID,
    (snap) => {
      if (!snap?.exists) {
        showMessage('Job not found', 'This job no longer exists, or it is not yours.');
        return;
      }
      const b = { id: BOOKING_ID, ...snap.data };
      if (_uid && b.artisanId !== _uid) {
        showMessage('Not your job', 'This booking belongs to another professional.');
        return;
      }
      _lastBooking = b;
      if (!_busy) render(withPhone(b));
      loadPhone(b);
      watchEscrow(b);
    },
    (err) => {
      if (/permission/i.test(String(err?.code || err?.message || ''))) { watchOffer(); return; }
      showMessage('Could not load this job', 'Check your connection and try again.', { label: 'Try again', href: location.href });
    }
  );
}

window.addEventListener('pagehide', () => { try { _unsub?.(); _offerUnsub?.(); _escrowUnsub?.(); } catch (_) {} clearInterval(_offerTick); _offerTick = null; });
// Restored from the back/forward cache with its listeners torn down: reload.
window.addEventListener('pageshow', (e) => { if (e.persisted) window.location.reload(); });
</script>
<script src="js/pwa.js" defer></script>
</body>
</html>
