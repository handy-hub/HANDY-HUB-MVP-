<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#F97316" />
  <title>Notifications | Fidus X for professionals</title>
  <script src="../shared/js/utils/themeManager.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/fx/notifications.css" />
</head>
<body class="fx-app">
<a class="fx-skip" href="#notif-main">Skip to content</a>
<div class="fx-shell">
  <!-- Every alert Fidus X has sent the artisan (notifications, receiver = them),
       newest first, by day. Painted from cache first, refreshed live
       (CLAUDE.md §1); no chat text is ever cached. -->
  <header class="fx-appbar fx-appbar--push">
    <button class="fx-iconbtn" type="button" id="notif-back" aria-label="Back"><span data-icon="back"></span></button>
    <div class="fx-appbar__titles"><h1 class="fx-appbar__title">Notifications</h1></div>
    <div class="fx-appbar__actions"><button class="fx-btn fx-btn--tertiary" type="button" id="mark-all-btn" disabled>Mark all read</button></div>
  </header>

  <main class="fx-main" id="notif-main" tabindex="-1">
    <div class="fx-ntf__filters" role="group" aria-label="Show" id="notif-tabs">
      <button class="fx-ntf__filter" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="fx-ntf__filter" type="button" data-filter="Bookings" aria-pressed="false">Jobs</button>
      <button class="fx-ntf__filter" type="button" data-filter="Payments" aria-pressed="false">Payments</button>
      <button class="fx-ntf__filter" type="button" data-filter="Messages" aria-pressed="false">Messages</button>
      <button class="fx-ntf__filter" type="button" data-filter="System" aria-pressed="false">System</button>
    </div>

    <!-- Skeleton while loading: four rows, written out. This is static HTML, so a
         template expression here was printed as text instead of run (MED-UI). -->
    <div class="fx-ntf__loading" id="notif-loading" aria-hidden="true">
      <span class="fx-skel fx-skel--row"></span>
      <span class="fx-skel fx-skel--row"></span>
      <span class="fx-skel fx-skel--row"></span>
      <span class="fx-skel fx-skel--row"></span>
    </div>
    <div class="fx-ntf__list" id="notif-list" aria-live="polite" hidden></div>
    <div class="fx-ntf__state" id="notif-empty" hidden>
      <p class="fx-ntf__state-title" id="notif-empty-title">No notifications yet</p>
      <p id="notif-empty-sub">You'll see job requests, payments, and updates here</p>
    </div>
    <!-- Nothing cached and the list could not be read: say that, not "No
         notifications yet", which the page cannot know (NET-001). -->
    <div class="fx-ntf__state" id="notif-error" role="alert" hidden>
      <p class="fx-ntf__state-title">Couldn't load your notifications</p>
      <p>Check your connection and try again.</p>
      <button type="button" class="fx-btn fx-btn--secondary" id="notif-retry">Try again</button>
    </div>
  </main>

  <div class="fx-bottom">
    <nav class="fx-tabbar" aria-label="Main" id="tabbar"></nav>
  </div>
</div>

<script type="module">
import '../shared/js/utils/global-app.js';
import { icon }                                                        from './js/fx/icons.js';
import { renderTabbar }                                                from './js/fx/controls.js';
import { requireArtisanAuth }                                          from './js/utils/artisanAuthGuard.js';
import { subscribeToUserNotifications, markNotificationRead,
         markAllNotificationsRead, deleteNotification }                from '../shared/js/services/notificationRepository.js';
import { safeAppUrl }                                                  from '../shared/js/utils/safeAppUrl.js';
import { mountInstantView }                                            from '../shared/js/services/instantView.js';
import { offerState, LAPSED_OFFER_LABEL }                              from '../shared/js/domain/jobOffers.js';

for (const el of document.querySelectorAll('[data-icon]')) el.outerHTML = icon(el.dataset.icon, el.dataset.iconClass || '');
// Opened from Today's bell, or from Account.
renderTabbar(document.getElementById('tabbar'), { current: 'today' });
document.getElementById('notif-back').addEventListener('click', () => {
  if (history.length > 1 && document.referrer.indexOf(location.origin + '/') === 0) history.back();
  else window.location.href = 'dashboard.html';
});
document.getElementById('notif-retry').addEventListener('click', () => location.reload());

const { user } = await requireArtisanAuth({ allowPending: true });

// ── State ──────────────────────────────────────────────
let _all       = [];
let _filter    = 'all';
let _unsub     = null;

// ── DOM ────────────────────────────────────────────────
const listEl    = document.getElementById('notif-list');
const loadingEl = document.getElementById('notif-loading');
const emptyEl   = document.getElementById('notif-empty');
const errorEl   = document.getElementById('notif-error');
const markAllBtn = document.getElementById('mark-all-btn');

// ── Icon per kind (the system's icon set, coloured by the row) ─────────────
const ICONS = { Bookings: 'jobs', Offers: 'jobs', Payments: 'earnings', Messages: 'message', Reviews: 'check', System: 'info', General: 'bell' };

// ── Which tab a notification belongs to ────────────────
// The server writes two vocabularies: the tab names themselves ('Bookings',
// 'Payments', 'System'…) and the booking lifecycle's own types
// ('booking_completed', 'booking_cancelled'… — functions/bookings.js
// TRANSITIONS). The Jobs tab matched 'Bookings' exactly, so completions and
// cancellations appeared under All only (audit NOTIF-002). Every type maps to
// a tab here; a type nobody listed goes to System, so none is hidden from
// every tab. tests/artisan-cache-first.test.cjs holds this against every type
// the server writes.
const NOTIF_TAB = {
  Bookings: 'Bookings', Offers: 'Bookings', Reviews: 'Bookings',
  Payments: 'Payments',
  Messages: 'Messages',
  System: 'System', Updates: 'System', General: 'System',
};
function tabOf(type) {
  const t = String(type || '');
  if (NOTIF_TAB[t]) return NOTIF_TAB[t];
  if (/^booking_/i.test(t)) return 'Bookings';
  return 'System';
}

function iconName(type) {
  return ICONS[type] || ICONS[tabOf(type)] || ICONS.General;
}
const iconFor = (type) => icon(iconName(type));
const FILTER_NAME = { Bookings: 'Jobs', Payments: 'Payments', Messages: 'Messages', System: 'System' };

// ── Time formatter ─────────────────────────────────────
function timeAgo(date) {
  const diff = Date.now() - date.getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1)  return 'Just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24);
  if (d < 7)  return `${d}d ago`;
  return date.toLocaleDateString('en-GH', { day: 'numeric', month: 'short' });
}

function dayLabel(date) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const d     = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const diff  = (today - d) / 86400000;
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return date.toLocaleDateString('en-GH', { weekday: 'long', day: 'numeric', month: 'short' });
}

// ── Render ─────────────────────────────────────────────
function render(notifications) {
  loadingEl.hidden = true;
  errorEl.hidden = true;   // the list arrived after all
  listEl.hidden = false;

  markAllBtn.disabled = !notifications.some(n => !n.isRead);
  const filtered = _filter === 'all'
    ? notifications
    : notifications.filter(n => tabOf(n.type) === _filter);

  if (filtered.length === 0) {
    listEl.innerHTML = '';
    // "Yet" only when there is nothing at all; a filter with nothing says so.
    document.getElementById('notif-empty-title').textContent = notifications.length ? `Nothing under ${FILTER_NAME[_filter]}` : 'No notifications yet';
    document.getElementById('notif-empty-sub').textContent = notifications.length ? 'Choose All to see everything.' : 'You\'ll see job requests, payments, and updates here';
    emptyEl.hidden = false;
    scheduleLapse(notifications);
    return;
  }
  emptyEl.hidden = true;

  // Group by day
  const groups = {};
  for (const n of filtered) {
    const label = dayLabel(n.createdAt);
    if (!groups[label]) groups[label] = [];
    groups[label].push(n);
  }

  let html = '';
  for (const [day, items] of Object.entries(groups)) {
    html += `<h2 class="fx-ntf__day">${escHtml(day)}</h2><ul class="fx-ntf__group">`;
    for (const n of items) {
      // An offer alert carries its offer's deadline; past it, the offer cannot
      // be answered, so the row says so (offerState: lapsed at now >= expiresAtMs).
      const lapsed = n.expiresAtMs != null && offerState({ expiresAtMs: n.expiresAtMs }).expired;
      html += `
      <li class="notif-item fx-ntf__item"${n.isRead ? '' : ' data-unread'}${lapsed ? ' data-lapsed' : ''} id="ni-${escHtml(n.id)}" data-id="${escHtml(n.id)}">
        <span class="fx-ntf__icon" aria-hidden="true">${iconFor(n.type)}</span>
        <div class="fx-ntf__main">
          <button class="notif-item-title fx-ntf__title" type="button" data-open="${escHtml(n.id)}">${escHtml(n.title)}</button>
          ${n.message ? `<p class="notif-item-msg">${escHtml(n.message)}</p>` : ''}
          <span class="fx-ntf__meta"><span>${timeAgo(n.createdAt)}</span>${lapsed ? `<span class="notif-lapsed">${LAPSED_OFFER_LABEL}</span>` : ''}${n.isRead ? '' : '<span class="fx-sr">Unread</span>'}</span>
        </div>
        ${n.isRead ? '' : '<span class="fx-ntf__dot" aria-hidden="true"></span>'}
        <button class="fx-iconbtn notif-delete-btn" type="button" data-delete="${escHtml(n.id)}" aria-label="Delete: ${escHtml(n.title)}">${icon('close')}</button>
      </li>`;
    }
    html += '</ul>';
  }
  listEl.innerHTML = html;
  scheduleLapse(notifications);
}

// One timer, re-armed on every render, that redraws the list when the next
// offer alert on it lapses — so an alert does not stay "live" while the
// screen is open. Cleared on pagehide.
let _lapseTimer = null;
function scheduleLapse(notifications) {
  clearTimeout(_lapseTimer); _lapseTimer = null;
  const next = Math.min(...notifications
    .map((n) => offerState({ expiresAtMs: n.expiresAtMs }))
    .filter((st) => st.expiresAtMs !== null && !st.expired)
    .map((st) => st.expiresAtMs));
  if (Number.isFinite(next)) _lapseTimer = setTimeout(() => render(_all), Math.max(0, next - Date.now()) + 50);
}

function escHtml(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Interactions ───────────────────────────────────────
// Notification fields are written by other users, so none of them is built
// into a handler string: rows carry only their id, and the link is looked up
// and checked (safeAppUrl) at tap time (SEC-001). The title is a real button
// (keyboard and screen reader); a tap anywhere on the row does the same.
listEl.addEventListener('click', (e) => {
  const del = e.target.closest('[data-delete]');
  if (del) { e.stopPropagation(); deleteNotif(del.dataset.delete); return; }
  const row = e.target.closest('.notif-item[data-id]');
  if (row) openNotif(row.dataset.id);
});

async function openNotif(id) {
  const notif = _all.find(n => n.id === id);
  if (notif && !notif.isRead) {
    notif.isRead = true;
    const el = document.getElementById(`ni-${id}`);
    if (el) { el.removeAttribute('data-unread'); el.querySelector('.fx-ntf__dot')?.remove(); }
    await markNotificationRead(id).catch(() => {});
  }
  const href = safeAppUrl(notif?.actionUrl);
  if (href) window.location.href = href;
}

async function deleteNotif(id) {
  // Focus would be lost with the row: hand it to the next row's title, or the filters.
  const el = document.getElementById(`ni-${id}`);
  const next = el && (el.nextElementSibling || el.previousElementSibling);
  _all = _all.filter(n => n.id !== id);
  render(_all);
  const target = (next && document.querySelector(`#${CSS.escape(next.id)} .fx-ntf__title`)) || document.querySelector('.fx-ntf__filter[aria-pressed="true"]');
  target?.focus();
  await deleteNotification(id).catch(() => {});
}

markAllBtn.addEventListener('click', async () => {
  markAllBtn.disabled = true;
  _all.forEach(n => { n.isRead = true; });
  render(_all);
  await markAllNotificationsRead(user.uid).catch(() => {});
});

document.getElementById('notif-tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-filter]');
  if (!btn) return;
  _filter = btn.dataset.filter;
  for (const t of document.querySelectorAll('#notif-tabs [data-filter]')) t.setAttribute('aria-pressed', String(t === btn));
  render(_all);
});

// ── Subscribe ──────────────────────────────────────────
// Cache first (CLAUDE.md §1, PERF-002): a return visit paints the last list at
// once and the listener refreshes it silently. Only what a row shows is cached
// — no metadata, sender or receiver ids. createdAt is stored as ISO text and
// revived to a Date for the renderer.
//
// No chat text in any cache: a 'Messages' notification's message is a preview
// of what the other person wrote (chatRepository), which can carry their phone
// number. It is kept out of the cached row and held in memory from the live
// list only (LIVE_CHAT_TEXT); a cached paint shows that row's title alone. The
// same rule as the inbox (messages.html). version 2: a v1 payload could hold
// such text and is never painted.
const LIVE_CHAT_TEXT = new Map();
const cacheable = (n) => {
  const chat = n.type === 'Messages';
  if (chat) LIVE_CHAT_TEXT.set(n.id, n.message || '');
  return {
    id: n.id, type: n.type, title: n.title, isRead: !!n.isRead,
    ...(chat ? {} : { message: n.message }),
    actionUrl: n.actionUrl ?? null,
    // An offer alert's deadline (dispatch writes metadata.expiresAtMs): a
    // number, kept so the row can show the offer has lapsed (NOTIF-005).
    expiresAtMs: offerState({ expiresAtMs: n.metadata?.expiresAtMs }).expiresAtMs,
    createdAt: n.createdAt instanceof Date ? n.createdAt.toISOString() : n.createdAt,
  };
};
const view = mountInstantView({
  key: 'artisan-notifications',
  version: 2,
  render: (items) => {
    _all = (items || []).map((n) => ({
      ...n,
      message: n.type === 'Messages' ? (LIVE_CHAT_TEXT.get(n.id) || '') : n.message,
      createdAt: new Date(n.createdAt),
    }));
    render(_all);
  },
  // A genuine first visit: the skeleton in the markup is already showing.
  onEmpty: () => { loadingEl.hidden = false; },
  subscribe: (_c, onData, onError) => subscribeToUserNotifications(
    user.uid, (notifications) => onData(notifications.map(cacheable)), onError),
  // A failed refresh never blanks a list already on screen.
  onError: (_err, { hasContent }) => {
    if (hasContent) return;
    loadingEl.hidden = true;
    emptyEl.hidden   = true;
    errorEl.hidden   = false;
  },
});
_unsub = () => view.destroy();

window.addEventListener('pagehide', () => { _unsub?.(); clearTimeout(_lapseTimer); });
</script>
<!-- The liveness heartbeat on every artisan page (it draws no bar here: the page has its own). -->
<script src="js/artisanFloatingNav.js"></script>
<script src="js/pwa.js" defer></script>
</body>
</html>
