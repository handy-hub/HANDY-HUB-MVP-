<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F97316" />
  <title>Offline | Fidus X for professionals</title>
  <!-- Self-contained on purpose: this page is shown by artisan-app/sw.js when
       there is no network, so it cannot depend on anything else being cached.
       It shows no account data. Its values are the design system's
       (artisan-app/css/tokens.css), written out because tokens.css may not be
       cached; orange carries an ink label (design decision 01). -->
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #FFFFFF; color: #111316;
           font: 400 16px/1.5 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    main { max-width: 28rem; padding: 32px 20px; box-sizing: border-box; width: 100%; }
    .word { margin: 0 0 32px; display: flex; flex-direction: column; gap: 2px; }
    .word b { font-weight: 650; font-size: 1.5rem; line-height: 1.875rem; letter-spacing: -0.01em; }
    .word span { font-weight: 550; font-size: .875rem; line-height: 1.25rem; color: #3B4048; }
    h1 { margin: 0 0 8px; font-weight: 650; font-size: 1.5rem; line-height: 1.875rem; letter-spacing: -0.01em; }
    p  { margin: 0 0 24px; color: #3B4048; }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 8px; background: #F97316; color: #111316;
             font: inherit; font-weight: 650; cursor: pointer; }
    button:focus-visible { outline: 2px solid #111316; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="word"><b>Fidus X</b><span>for professionals</span></p>
    <h1>You're offline</h1>
    <p>Fidus X needs a connection to show your jobs and earnings. A job request that arrives while you're offline may expire before you can answer it.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
