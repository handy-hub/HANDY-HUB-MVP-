<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#F97316" />
  <title>My Jobs | Fidus X for professionals</title>
  <script src="../shared/js/utils/themeManager.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The variable axes: fixed weights would snap 550 and 650 to the nearest file. -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/fx/jobs.css" />
</head>
<body class="fx-app">
<a class="fx-skip" href="#jobs-main">Skip to content</a>
<div class="fx-shell">

  <!-- Every booking this artisan has taken, by what it needs: Current (needs
       you, waiting on the customer, on hold), Upcoming (booked slots not yet
       open), History (closed). Rows open the job screen, where its actions are. -->
  <header class="fx-appbar fx-appbar--root">
    <div class="fx-appbar__titles">
      <h1 class="fx-appbar__title">Jobs</h1>
      <p class="fx-appbar__sub" id="jobs-sub"></p>
    </div>
  </header>

  <div class="fx-jobs__views">
    <div class="fx-seg" role="group" aria-label="Show" id="jobs-views">
      <button class="fx-seg__btn" type="button" data-view="current" aria-pressed="true">Current</button>
      <button class="fx-seg__btn" type="button" data-view="upcoming" aria-pressed="false">Upcoming</button>
      <button class="fx-seg__btn" type="button" data-view="history" aria-pressed="false">History</button>
    </div>
    <div class="fx-seg" role="group" aria-label="History filter" id="jobs-filters" hidden>
      <button class="fx-seg__btn" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="fx-seg__btn" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      <button class="fx-seg__btn" type="button" data-filter="cancelled" aria-pressed="false">Cancelled</button>
    </div>
  </div>

  <main class="fx-main" id="jobs-main" tabindex="-1">
    <div class="fx-jobs__notices fx-stack" id="jobs-notices"></div>
    <div id="jobs-list">
      <section class="fx-jobs__empty fx-stack" aria-busy="true" data-skeleton>
        <span class="fx-skel fx-skel--row"></span><span class="fx-skel fx-skel--row"></span><span class="fx-skel fx-skel--row"></span>
      </section>
    </div>
  </main>

  <div class="fx-bottom">
    <nav class="fx-tabbar" aria-label="Main" id="tabbar"></nav>
  </div>
</div>

<script>
/* Old links first, before anything loads: one booking has its own screen.
   ?id= came from bookings.html and old notifications; ?quote= from the Today
   dock and the job screen, when the quote composer lived here — it is mounted
   inline on the job screen now (shared/js/ui/quoteComposer.js). */
(function () {
  var q = new URLSearchParams(location.search);
  var one = q.get('id') || q.get('quote');
  if (one) { window.__jobsLeaving = true; location.replace('job.html?id=' + encodeURIComponent(one)); }
})();
</script>

<script type="module">
import '../shared/js/utils/global-app.js';
import { icon }                                 from './js/fx/icons.js';
import { renderTabbar }                         from './js/fx/controls.js';
import { jobsModel, renderJobs, tickOffers }    from './js/jobsScreen.js';
import { ACTIVE_LIST, activeQuery, OFFERS_LIST, offersQuery, HISTORY_LIST, HISTORY_PAGE, historyQuery }
                                                from './js/artisanLists.js';
import { JOB_VIEWS, HISTORY_FILTERS, HISTORY_STATUSES } from '../shared/js/domain/artisanJobs.js';
import { offerState }                           from '../shared/js/domain/jobOffers.js';
import { storedAvailability }                   from '../shared/js/domain/availability.js';
import { getAppContainer }                      from '../shared/js/app/container.js';
import { mountInstantView }                     from '../shared/js/services/instantView.js';
import { startPresence, stopPresence }          from '../shared/js/services/presenceService.js';
import { rememberScroll }                       from '../shared/js/utils/scrollMemory.js';
import { requireArtisanAuth, subscribeToArtisanAuthState } from './js/utils/artisanAuthGuard.js';

// Forwarding to the job screen (the script above): load nothing here.
if (window.__jobsLeaving) await new Promise(() => {});

for (const el of document.querySelectorAll('[data-icon]')) el.outerHTML = icon(el.dataset.icon);
renderTabbar(document.getElementById('tabbar'), { current: 'jobs' });

// ── Where the artisan was: the view and filter live in the URL ───────────────
// A reload, Back from a job, or a shared link lands on the same view (STATE-001).
// Old ?tab= values (pending / active / completed / cancelled) still land right.
const LEGACY_TAB = { pending: ['current', 'all'], active: ['current', 'all'], completed: ['history', 'completed'], cancelled: ['history', 'cancelled'] };
const params = new URLSearchParams(location.search);
const legacy = LEGACY_TAB[params.get('tab')] || null;
let _view   = JOB_VIEWS.includes(params.get('view')) ? params.get('view') : (legacy ? legacy[0] : 'current');
let _filter = HISTORY_FILTERS.includes(params.get('filter')) ? params.get('filter') : (legacy ? legacy[1] : 'all');
function keepInUrl() {
  try {
    const url = new URL(location.href);
    url.searchParams.delete('tab');
    url.searchParams.set('view', _view);
    if (_view === 'history') url.searchParams.set('filter', _filter); else url.searchParams.delete('filter');
    history.replaceState(history.state, '', url);
  } catch (_) { /* the view still switches */ }
}
keepInUrl();

// Blocking guard: auth + role + not suspended. Pending artisans can view their jobs.
await requireArtisanAuth({ allowPending: true });
const { services: { databaseService } } = getAppContainer();

const dom = {
  views:   document.getElementById('jobs-views'),
  filters: document.getElementById('jobs-filters'),
  list:    document.getElementById('jobs-list'),
  sub:     document.getElementById('jobs-sub'),
};
const notices = document.getElementById('jobs-notices');

// ── State ─────────────────────────────────────────────────────────────────────
let uid = null;
let _active = [];          // live: bookings still going (shared with Today)
let _offers = [];          // live: open offers (shared with Today)
let _activeReady = false;
let _origin = {};          // the artisan's own position, for distance only
// History, a page at a time per filter. 'all' page 1 is live (a listener, so a
// job that closes appears at once); further pages and the filters are read on
// demand, and only once.
const _pages = Object.fromEntries(HISTORY_FILTERS.map((f) => [f, { first: [], more: [], cursor: null, done: false, loaded: false, busy: false, failed: false }]));
const _unsubs = [];
const rec = (r) => ({ id: r.id, ...(r.data || {}) });

// ── Paint ─────────────────────────────────────────────────────────────────────
let _lastSig = '';
function paint(force = false) {
  const nowMs = Date.now();
  const history = HISTORY_FILTERS.flatMap((f) => [..._pages[f].first, ..._pages[f].more]);
  const m = jobsModel({ view: _view, filter: _filter, active: _active, history, offers: _offers, nowMs, origin: _origin });
  const p = _pages[_filter];
  const ui = { nowMs, ready: { active: _activeReady, history: p.loaded },
               more: { can: p.loaded && !p.done, busy: p.busy, failed: p.failed } };
  // Draw only when what the screen says has changed: a redraw replaces the row
  // under a finger that may be about to tap it.
  const sig = JSON.stringify([m, ui.ready, ui.more]);
  if (!force && sig === _lastSig) return;
  _lastSig = sig;
  renderJobs(dom, m, ui);
}

// ── History pages ─────────────────────────────────────────────────────────────
function cursorOf(list) {
  const last = list[list.length - 1];
  return last ? (last.updatedAt ?? null) : null;
}
async function loadMore(filter) {
  const p = _pages[filter];
  if (!uid || p.busy || p.done) return;          // one request at a time per filter
  p.busy = true; p.failed = false; paint();
  try {
    const all = [...p.first, ...p.more];
    const after = all.length ? cursorOf(all) : null;
    const statuses = filter === 'all' ? [...HISTORY_STATUSES] : [filter];
    const page = (await databaseService.queryWithOptions(...historyQuery(uid, { statuses, after }))).map(rec);
    const have = new Set(all.map((b) => b.id));
    p.more.push(...page.filter((b) => !have.has(b.id)));
    p.done = page.length < HISTORY_PAGE;
    p.loaded = true;
  } catch (e) {
    console.warn('[jobs] history page failed:', e?.message || e);
    p.failed = true;
    p.loaded = true;
  } finally {
    p.busy = false;
    paint();
  }
}

// ── Controls ──────────────────────────────────────────────────────────────────
dom.views.addEventListener('click', (e) => {
  const b = e.target.closest('[data-view]');
  if (!b || b.dataset.view === _view) return;
  _view = b.dataset.view;
  keepInUrl();
  window.scrollTo(0, 0);
  if (_view === 'history' && !_pages[_filter].loaded) loadMore(_filter);
  paint();
});
dom.filters.addEventListener('click', (e) => {
  const b = e.target.closest('[data-filter]');
  if (!b || b.dataset.filter === _filter) return;
  _filter = b.dataset.filter;
  keepInUrl();
  if (!_pages[_filter].loaded) loadMore(_filter);
  paint();
});
dom.list.addEventListener('click', (e) => {
  if (e.target.closest('[data-act="more"]')) loadMore(_filter);
});

// ── Notices ───────────────────────────────────────────────────────────────────
// Shown when Firestore cannot be reached. What is on screen stays.
function showConnectionNotice() {
  let el = document.getElementById('jobs-offline');
  if (!el) {
    el = document.createElement('div');
    el.id = 'jobs-offline';
    el.className = 'fx-notice fx-notice--warn';
    el.setAttribute('role', 'status');
    el.innerHTML = `${icon('alert', 'fx-notice__icon')}<div class="fx-notice__body"><p></p><div class="fx-notice__actions"></div></div>`;
    el.querySelector('p').textContent = 'We can\'t reach Fidus X right now. Showing what we last had — it updates when you\'re back online.';
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'fx-btn fx-btn--tertiary fx-btn--s'; b.textContent = 'Retry';
    b.addEventListener('click', () => window.location.reload());
    el.querySelector('.fx-notice__actions').appendChild(b);
    notices.appendChild(el);
  }
  el.hidden = false;
}
function hideConnectionNotice() {
  const el = document.getElementById('jobs-offline');
  if (el) el.hidden = true;
}

// One ticker for the offer countdowns on screen; a lapsed offer leaves the list.
const _ticker = setInterval(() => {
  if (tickOffers(dom.list, Date.now()).length) paint(true);
}, 1000);
// A booked slot opens with time, not with data: look again each minute.
const _clock = setInterval(() => paint(), 60_000);

// Back from a job lands where the artisan was in the list.
rememberScroll({ name: 'jobs.html' });

// ── Data ──────────────────────────────────────────────────────────────────────
subscribeToArtisanAuthState(async (user) => {
  if (!user) { window.location.replace('login.html'); return; }
  if (uid === user.uid) return;
  uid = user.uid;

  // A list answered from the CACHE with nothing in it while Firestore is
  // unreachable is "not known yet", not "none" (audit NET-001): keep what is on
  // screen and say so. (The metadata reaches here since ff317b4.)
  const liveList = (onData) => (records, meta) => {
    if (meta && meta.fromCache && !records.length) { showConnectionNotice(); return; }
    hideConnectionNotice();
    onData(records);
  };

  // Bookings still going, and open offers: the SAME lists Today shows, from the
  // same cache entries (js/artisanLists.js) — painted at once if Today loaded them.
  _unsubs.push(mountInstantView({
    key: ACTIVE_LIST.key, version: ACTIVE_LIST.version, stripFields: [...ACTIVE_LIST.stripFields],
    render: (records) => { _active = records.map(rec); _activeReady = true; paint(); },
    subscribe: (_c, onData, onError) => databaseService.subscribeToCollection(...activeQuery(uid), liveList(onData), onError),
    onError: () => { showConnectionNotice(); _activeReady = true; paint(); },
  }).destroy);
  _unsubs.push(mountInstantView({
    key: OFFERS_LIST.key, version: OFFERS_LIST.version, stripFields: [...OFFERS_LIST.stripFields],
    render: (records, { fromCache }) => {
      // A cached offer whose deadline has passed cannot be answered: dropped.
      _offers = (fromCache ? records.filter((r) => !offerState(r.data).expired) : records).map(rec);
      paint();
    },
    subscribe: (_c, onData, onError) => databaseService.subscribeToCollection(...offersQuery(uid), liveList(onData), onError),
    onError: () => paint(),
  }).destroy);
  // History, first page of All: live, and painted from the last visit at once.
  _unsubs.push(mountInstantView({
    key: HISTORY_LIST.key, version: HISTORY_LIST.version, stripFields: [...HISTORY_LIST.stripFields],
    render: (records, { fromCache }) => {
      const p = _pages.all;
      p.first = records.map(rec);
      p.loaded = true;
      if (!fromCache && !p.more.length) { p.done = records.length < HISTORY_PAGE; }
      paint();
    },
    subscribe: (_c, onData, onError) => databaseService.subscribeToCollection(...historyQuery(uid), liveList(onData), onError),
    onError: () => { _pages.all.loaded = true; _pages.all.failed = true; paint(); },
  }).destroy);
  if (_view === 'history' && _filter !== 'all') loadMore(_filter);

  // Presence: GPS + heartbeat while an active job may be tracked, started from
  // the artisan's STORED choice — presence never writes availability
  // (shared/js/domain/availability.js). The artisan's own position also gives
  // each row its distance (their private record; the public one is ~1 km).
  try {
    const snap = await databaseService.getDocument('artisans', user.uid);
    if (snap?.exists) {
      const a = snap.data || {};
      const loc = await databaseService.getDocument(`artisans/${user.uid}/private`, 'location').catch(() => null);
      const p = (loc && loc.exists && loc.data) || {};
      const la = Number(p.lat ?? a.lat), ln = Number(p.lng ?? a.lng);
      if (Number.isFinite(la) && Number.isFinite(ln) && !(la === 0 && ln === 0)) { _origin = { originLat: la, originLng: ln }; paint(); }
      const approved = String(a.verificationStatus || '').toLowerCase() === 'approved';
      startPresence(user.uid, databaseService, approved && storedAvailability(a), {
        onLocationError: (err) => console.warn('[jobs] GPS:', err.message),
      });
    }
  } catch (e) {
    console.warn('[jobs] Could not resume presence:', e);
  }
});

window.addEventListener('pagehide', () => {
  _unsubs.forEach((u) => u && u());
  clearInterval(_ticker);
  clearInterval(_clock);
  stopPresence();
});
// Restored from the back/forward cache with its listeners torn down: reload
// (the cache paints the list at once).
window.addEventListener('pageshow', (e) => { if (e.persisted) window.location.reload(); });
</script>
<script src="js/artisanFloatingNav.js"></script>
<script src="js/pwa.js" defer></script>
</body>
</html>
