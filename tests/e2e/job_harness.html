<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Job screen harness (tests only)</title>
</head>
<body class="fx-app">
<!--
  tests/e2e/artisan_job.py loads this. It takes the REAL artisan-app/job.html
  markup and stylesheets (scripts removed) and draws bookings into it through the
  real artisan-app/js/jobScreen.js, with a fixed clock. No Firebase.
-->
<script type="module">
  const res = await fetch('/artisan-app/job.html');
  const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
  const base = new URL('/artisan-app/', location.origin);
  await Promise.all([...doc.querySelectorAll('head link[rel="stylesheet"]')]
    .filter((l) => !/^https?:/.test(l.getAttribute('href')))
    .map((l) => new Promise((ok) => {
      const n = document.createElement('link');
      n.rel = 'stylesheet'; n.href = new URL(l.getAttribute('href'), base).href;
      n.onload = n.onerror = ok; document.head.appendChild(n);
    })));
  for (const s of doc.body.querySelectorAll('script')) s.remove();
  document.body.className = doc.body.className;
  document.body.prepend(...[...doc.body.childNodes].map((n) => document.importNode(n, true)));

  const { icon } = await import('/artisan-app/js/fx/icons.js');
  const screen = await import('/artisan-app/js/jobScreen.js');
  for (const el of document.querySelectorAll('[data-icon]')) el.outerHTML = icon(el.dataset.icon);

  const dom = { body: document.getElementById('jb-body'), dock: document.getElementById('jb-dock'), sub: document.getElementById('jb-ref') };
  window.__job = {
    show(b, opts = {}) {
      const plan = screen.jobPlan(b, { offerGone: !!opts.offerGone, nowMs: opts.nowMs });
      screen.renderJob(dom, b, plan, { nowMs: opts.nowMs, bookingId: b.id || b.bookingId, busy: opts.busy || null, escrow: opts.escrow || null });
      return { kind: plan.kind, lapsed: !!plan.lapsed, mountQuote: !!plan.mountQuote, primary: plan.primary && plan.primary.act,
               secondary: (plan.secondary || []).map((s) => s.act) };
    },
    message(t, body) { screen.renderMessage(dom, t, body); },
    tick(nowMs) { return screen.paintCountdown(dom.body, nowMs); },
  };
  document.documentElement.dataset.ready = 'true';
</script>
</body>
</html>
