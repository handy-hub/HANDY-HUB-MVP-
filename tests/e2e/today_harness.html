<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Today harness (tests only)</title>
  <script src="/artisan-app/js/theme.js"></script>
</head>
<body class="fx-app">
<!--
  tests/e2e/artisan_today.py loads this. It takes the REAL artisan-app/dashboard.html
  markup and stylesheets (scripts removed) and draws resolveToday() states into it
  through the real artisan-app/js/today.js, with a fixed clock. No Firebase.
-->
<script type="module">
  const res = await fetch('/artisan-app/dashboard.html');
  const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
  const base = new URL('/artisan-app/', location.origin);
  await Promise.all([...doc.querySelectorAll('head link[rel="stylesheet"]')]
    .filter((l) => !/^https?:/.test(l.getAttribute('href')))
    .map((l) => new Promise((ok) => {
      const n = document.createElement('link');
      n.rel = 'stylesheet'; n.href = new URL(l.getAttribute('href'), base).href;
      n.onload = n.onerror = ok; document.head.appendChild(n);
    })));
  for (const s of doc.body.querySelectorAll('script')) s.remove();
  document.body.className = doc.body.className;
  document.body.prepend(...[...doc.body.childNodes].map((n) => document.importNode(n, true)));

  const { icon } = await import('/artisan-app/js/fx/icons.js');
  const { renderTabbar } = await import('/artisan-app/js/fx/controls.js');
  const today = await import('/artisan-app/js/today.js');
  const domain = await import('/shared/js/domain/artisanToday.js');

  for (const el of document.querySelectorAll('[data-icon]')) el.outerHTML = icon(el.dataset.icon);
  renderTabbar(document.getElementById('tabbar'), { current: 'today' });

  const dom = {
    avail: document.getElementById('avail-btn'),
    main:  document.getElementById('today-state'),
    lists: document.getElementById('today-lists'),
    dock:  document.getElementById('today-dock'),
  };
  window.__today = {
    show(spec) {
      const state = domain.resolveToday({ artisan: spec.artisan, offers: spec.offers || [], bookings: spec.bookings || [], nowMs: spec.nowMs });
      const ui = { nowMs: spec.nowMs, saving: null, cached: false, busy: new Map(), onboarding: false, listsReady: true, ...(spec.ui || {}) };
      if (spec.busy) ui.busy = new Map(Object.entries(spec.busy));
      today.renderToday(dom, state, ui);
      return { mode: state.mode };
    },
    tick(nowMs) { return today.paintCountdowns(dom.main, nowMs); },
  };
  document.documentElement.dataset.ready = 'true';
</script>
</body>
</html>
